<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AWS Data Engineer — 6-Month Plan (26 Weeks) — Tracker</title>
<style>
:root{
  --bg:#0d1117; --bg2:#131a23; --panel:#161d27; --panel2:#1b2430;
  --line:#26303d; --line2:#33404f;
  --tx:#dbe3ec; --tx2:#93a2b4; --tx3:#6b7c90;
  --acc:#4ea3ff; --acc2:#7ee0c0; --gold:#e5b567; --warn:#f0883e;
  --major:#c792ea; --ok:#3fb950;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:4rem;
}
a{color:var(--acc);text-decoration:none;border-bottom:1px solid rgba(78,163,255,.28)}
a:hover{border-bottom-color:var(--acc)}
code{font-family:var(--mono);font-size:.86em;background:#0a0f16;border:1px solid var(--line);
  padding:.08em .36em;border-radius:4px;color:var(--acc2);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{line-height:1.25;margin:0}

/* ---------- sticky header ---------- */
.sticky{position:-webkit-sticky;position:sticky;top:0;z-index:50;
  background:rgba(13,17,23,.96);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:saturate(160%) blur(10px);backdrop-filter:saturate(160%) blur(10px)}
.sticky .wrap{padding-top:10px;padding-bottom:10px}
.hdrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdtitle{font-size:15px;font-weight:700;letter-spacing:.2px;margin-right:auto}
.hdtitle span{color:var(--tx3);font-weight:500}
.count{font-family:var(--mono);font-size:13px;color:var(--tx2);white-space:nowrap}
.count b{color:var(--acc2)}
.pct{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--acc);min-width:62px;text-align:right}
.bar{height:9px;border-radius:99px;background:#0a0f16;border:1px solid var(--line);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s ease}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.jump button{
  font:600 12px/1 inherit;color:var(--tx2);background:var(--panel);border:1px solid var(--line);
  padding:7px 10px;border-radius:99px;cursor:pointer}
.jump button:hover,.jump button:focus{color:var(--tx);border-color:var(--acc);outline:none}
.jump button.reset{margin-left:auto;color:var(--warn);border-color:rgba(240,136,62,.35)}

/* ---------- hero ---------- */
.hero{padding:34px 0 8px}
.hero h1{font-size:30px;letter-spacing:-.4px}
.hero .sub{color:var(--tx2);margin-top:8px;font-size:15px}
.hero p{color:var(--tx2);font-size:15px}

/* ---------- generic panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.panel>h3{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);margin-bottom:10px}
.panel p{margin:.5em 0;color:var(--tx2);font-size:15px}
.panel ul{margin:.5em 0;padding-left:1.1em;color:var(--tx2);font-size:15px}
.panel li{margin:.32em 0}
.panel strong{color:var(--tx)}
.panel.accent{border-left:3px solid var(--acc)}
.panel.done{border-left:3px solid var(--ok)}
.panel.warn{border-left:3px solid var(--warn)}
.panel.ref{border-left:3px solid var(--gold);background:var(--panel2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

details.fold>summary{cursor:pointer;list-style:none;color:var(--tx3);font-size:13px;
  text-transform:uppercase;letter-spacing:.9px;font-weight:700;padding:2px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:"▸ ";color:var(--acc)}
details.fold[open]>summary:before{content:"▾ "}

pre.code{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:#080c12;
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;
  color:var(--acc2);margin:.6em 0;-webkit-overflow-scrolling:touch}
pre.tree{color:var(--tx2)}
pre.tree b{color:var(--gold);font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:14px;margin:.4em 0}
table.t th{text-align:left;color:var(--tx3);font-size:11px;text-transform:uppercase;
  letter-spacing:.8px;border-bottom:1px solid var(--line2);padding:7px 10px 7px 0}
table.t td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;color:var(--tx2);vertical-align:top}
table.t td:first-child{color:var(--tx);font-weight:600;white-space:nowrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- phases ---------- */
.phase{margin-top:34px;scroll-margin-top:150px}
.phhead{border-top:2px solid var(--line2);padding-top:16px}
.phtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phnum{font-family:var(--mono);font-size:12px;font-weight:700;color:#0d1117;background:var(--acc);
  padding:3px 8px;border-radius:5px;letter-spacing:.5px}
.phhead h2{font-size:22px;letter-spacing:-.2px}
.phrange{color:var(--tx3);font-size:13px;font-family:var(--mono)}
.phpct{margin-left:auto;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--acc2)}
.phbar{height:5px;border-radius:99px;background:#0a0f16;border:1px solid var(--line);overflow:hidden;margin-top:9px}
.phbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s}
.phintro{color:var(--tx2);font-style:italic;font-size:14.5px;margin:11px 0 4px}

/* ---------- weeks ---------- */
.wk{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden}
.wk.major{border-color:rgba(199,146,234,.5);background:linear-gradient(180deg,rgba(199,146,234,.07),var(--panel) 90px)}
.wk.complete{border-color:rgba(63,185,80,.45)}
.wkhead{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;width:100%;
  background:none;border:0;text-align:left;color:inherit;font:inherit}
.wkhead:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.chev{color:var(--tx3);font-size:11px;flex:0 0 12px;transition:transform .18s}
.wk.open .chev{transform:rotate(90deg)}
.wknum{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--tx3);
  border:1px solid var(--line2);border-radius:5px;padding:3px 7px;flex:0 0 auto}
.wk.major .wknum{color:var(--major);border-color:rgba(199,146,234,.5)}
.wk.complete .wknum{color:var(--ok);border-color:rgba(63,185,80,.5)}
.wkname{font-weight:650;font-size:15px;flex:1 1 auto;min-width:0}
.wk.major .wkname{color:#e6d3f5}
.wkmeta{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.tick{font-family:var(--mono);font-size:11px;color:var(--tx3);white-space:nowrap}
.wk.complete .tick{color:var(--ok)}
.minibar{width:56px;height:5px;border-radius:99px;background:#0a0f16;border:1px solid var(--line);overflow:hidden}
.minibar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.wk.complete .minibar>i{background:var(--ok)}
.badge{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--major);border:1px solid rgba(199,146,234,.45);border-radius:4px;padding:2px 6px}
@media(max-width:620px){
  .wkname{flex-basis:100%;order:5}
  .minibar{display:none}
}
.wkbody{display:none;padding:2px 15px 17px;border-top:1px solid var(--line)}
.wk.open .wkbody{display:block}
.goal{color:var(--tx2);font-size:14.5px;margin:13px 0 4px}
.goal b{color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:.9px;
  display:block;margin-bottom:3px;font-weight:800}

.blk{margin-top:16px}
.blk>h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);
  margin-bottom:8px;font-weight:800}

.day{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(38,48,61,.6)}
.day:last-child{border-bottom:0}
.day label{display:flex;gap:10px;cursor:pointer;flex:1 1 auto;align-items:flex-start}
.day input{-webkit-appearance:none;appearance:none;flex:0 0 19px;width:19px;height:19px;margin:2px 0 0;
  border:1.5px solid var(--line2);border-radius:5px;background:#0a0f16;cursor:pointer;position:relative}
.day input:checked{background:var(--ok);border-color:var(--ok)}
.day input:checked:after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:9px;
  border:solid #0d1117;border-width:0 2px 2px 0;transform:rotate(42deg)}
.day input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dtx{flex:1 1 auto;font-size:14.5px;color:var(--tx2);min-width:0}
.dtx>b{color:var(--tx);font-family:var(--mono);font-size:11.5px;letter-spacing:.6px;
  text-transform:uppercase;margin-right:7px}
.day input:checked~.dtx{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--line2)}
.dayres{margin:7px 0 0;padding:7px 0 0 0;border-top:1px dashed var(--line);font-size:13.5px;color:var(--tx3)}
.dayres em{color:var(--gold);font-style:normal;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.7px;margin-right:6px}

/* per-day file guidance */
.dayfile{margin-top:7px;display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;font-size:13px}
.fa{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.fa-new{color:#7ee0c0;border-color:rgba(126,224,192,.45);background:rgba(126,224,192,.08)}
.fa-continue{color:#4ea3ff;border-color:rgba(78,163,255,.4);background:rgba(78,163,255,.07)}
.fa-reuse{color:#c792ea;border-color:rgba(199,146,234,.45);background:rgba(199,146,234,.08)}
.fa-none{color:#6b7c90;border-color:var(--line2)}
.fp{font-family:var(--mono);font-size:12px;color:var(--acc2);word-break:break-all}
.fn{color:var(--tx3);font-size:12.5px;flex:1 1 100%}

/* data-for-this-week blocks */
.datablk{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:12px 13px;margin-bottom:11px}
.dbh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.dbt{font-size:14px;font-weight:650;color:var(--tx);flex:1 1 auto;min-width:0}
.dbl{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:var(--gold);border:1px solid rgba(229,181,103,.4);
  border-radius:4px;padding:2px 6px}
button.copy{font:700 11px/1 inherit;color:var(--tx2);background:var(--panel);
  border:1px solid var(--line2);border-radius:6px;padding:6px 11px;cursor:pointer;
  min-width:64px}
button.copy:hover{color:var(--tx);border-color:var(--acc)}
button.copy.ok{color:var(--ok);border-color:var(--ok)}
button.copy.warn{color:var(--warn);border-color:var(--warn)}
.dbn{font-size:13.5px;color:var(--tx2);margin:0 0 8px}
.datablk pre.code{max-height:340px;overflow:auto;margin:0}
.dbc{margin-top:9px;background:rgba(229,181,103,.07);border:1px solid rgba(229,181,103,.26);
  border-radius:7px;padding:10px 12px;font-size:13.5px;color:var(--tx2)}
.dbc b{display:block;color:var(--gold);font-size:10.5px;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:4px;font-weight:800}

/* per-day video chapter */
.dayvid{margin-top:6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;font-size:13px}
.dayvid .vi{color:#ff5c5c;font-size:11px}
.dayvid a{color:var(--tx);border-bottom-color:rgba(219,227,236,.25)}
.dayvid a:hover{border-bottom-color:var(--acc)}
.vt{font-family:var(--mono);font-size:11.5px;color:var(--gold)}
.vs{font-size:11px;color:var(--tx3)}

.files{display:flex;flex-wrap:wrap;gap:6px}
.files span{font-family:var(--mono);font-size:12px;color:var(--acc2);background:#080c12;
  border:1px solid var(--line2);border-radius:5px;padding:5px 9px;word-break:break-all}
.mini{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:8px;padding:12px 14px}
.mini .mh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
.mini p{margin:.4em 0;font-size:14.5px;color:var(--tx2)}
.mini .feeds{font-size:13px;color:var(--acc);font-style:italic}
.dod{background:rgba(63,185,80,.07);border:1px solid rgba(63,185,80,.25);border-radius:8px;
  padding:12px 14px;font-size:14.5px;color:var(--tx2)}
.dod b{color:var(--ok);font-size:11px;text-transform:uppercase;letter-spacing:1px;
  display:block;margin-bottom:4px;font-weight:800}
.res{list-style:none;padding:0;margin:0}
.res li{font-size:14px;color:var(--tx2);padding:4px 0 4px 14px;position:relative}
.res li:before{content:"";position:absolute;left:0;top:13px;width:5px;height:5px;
  border-radius:50%;background:var(--line2)}
.spec{background:rgba(199,146,234,.07);border:1px solid rgba(199,146,234,.28);border-radius:8px;
  padding:12px 14px;font-size:14.5px;color:var(--tx2)}
.callout{background:rgba(240,136,62,.07);border:1px solid rgba(240,136,62,.28);border-radius:8px;
  padding:12px 14px;font-size:14.5px;color:var(--tx2);margin-top:14px}
.callout b{color:var(--warn);display:block;font-size:11px;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:4px;font-weight:800}

/* ---------- mini-project tracker ---------- */
.mpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:760px){.mpgrid{grid-template-columns:1fr}}
.mprow{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mprow input{-webkit-appearance:none;appearance:none;flex:0 0 18px;width:18px;height:18px;margin:1px 0 0;
  border:1.5px solid var(--line2);border-radius:5px;background:#0a0f16;cursor:pointer;position:relative}
.mprow input:checked{background:var(--gold);border-color:var(--gold)}
.mprow input:checked:after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;
  border:solid #0d1117;border-width:0 2px 2px 0;transform:rotate(42deg)}
.mprow label{cursor:pointer;flex:1 1 auto;min-width:0}
.mpname{font-size:14px;color:var(--tx);font-weight:600}
.mprow input:checked~label .mpname{color:var(--tx3);text-decoration:line-through}
.mpsub{font-size:11.5px;color:var(--tx3);font-family:var(--mono);margin-top:3px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:1px 5px;
  border-radius:4px;margin-right:4px;border:1px solid}
.mp1{color:var(--acc);border-color:rgba(78,163,255,.4)}
.mp2{color:var(--acc2);border-color:rgba(126,224,192,.4)}
.mp3{color:var(--major);border-color:rgba(199,146,234,.4)}
.foot{color:var(--tx3);font-size:13px;margin-top:44px;border-top:1px solid var(--line);padding-top:18px}
.foot a{color:var(--tx2)}
</style>
</head>
<body>
<div class="sticky">
  <div class="wrap">
    <div class="hdrow">
      <div class="hdtitle">AWS Data Engineer <span>&middot; 26-week tracker</span></div>
      <div class="count" id="count">0 / 130 tasks</div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="jump" id="jump"></div>
  </div>
</div>
<div class="wrap"><main id="main"></main></div>
<script>
var DATA = {"title":"AWS Data Engineer — 6-Month Plan (26 Weeks)","whatThisIs":["Get hired as a **Data Engineer in UK fintech, a bank, or a capital-markets/FX data team** within six months, with Quant Developer as the later move — reached from inside a first engineering job, not applied to cold.","The mechanism is a portfolio that proves end-to-end ownership on AWS, built from finance/markets data. Every week produces a committed artefact. Small components accumulate into three major projects, so nothing is throwaway practice — the utility functions written in Week 1 end up inside the capstone.","This plan is deliberately exhaustive rather than minimal. It targets everything a UK junior/mid DE advert actually asks for: SQL depth, Python that is packaged and tested, dimensional modelling, dbt, orchestration, IaC, containers, streaming, IAM/security, data quality, and CI/CD."],"panels":[{"id":"targeting","title":"Targeting note","tone":"accent","body":["The content surface area here sits above a typical *junior* advert and closer to *mid*. That's deliberate — only a small slice of DE postings are genuinely entry-level, so a portfolio that only clears the junior bar competes in the most crowded pool. With 2+ years as a Data Analyst plus paid GCP/BigQuery/Dataform work, apply to **Analytics Engineer** and unprefixed **Data Engineer** roles as the target, and Junior DE as the floor."]},{"id":"alreadydone","title":"Already done — not repeated below","tone":"done","list":["GitHub account and `aws-de-portfolio` repo created","VS Code as the editor","AWS account live","**AWS Budgets alert set** — the main cost guardrail, done","**First S3 bucket created** (`ronald-foundations-raw-dev`)"],"body":["Remaining one-off check before Week 1: confirm `python3 --version`, `git --version` and the VS Code Python extension all work."]},{"id":"perday","title":"How to read a day — added layer, not from the original plan","tone":"accent","body":["Expand any week and each daily task carries two extra rows underneath it. Both are additions on top of your plan, so treat them as scaffolding you can overrule:"],"list":["**Create / Continue / Carried over / No file** — which file or folder that day touches. *Create* means a new file or directory; *Continue* means yesterday's file; *Carried over* means an artefact you built in an earlier week and should copy in rather than rewrite; *No file* means a reading, console or paper day with nothing to commit. Inferred from each week's own \"Files this week\" block and the plan's stated dependencies.","**▶ A chapter link into that week's course video**, jumping to the timestamp that covers the day's topic. Every timestamp was read from YouTube's own chapter data on 29 July 2026 — none are estimated. Where a video has no chapters (Weeks 4, 13, 17, 22) or a day has no matching chapter, the day is left clean rather than padded with a guess."]},{"id":"changed","title":"What changed in this revision, and why","tone":"plain","body":["Two structural problems were fixed rather than papered over:","**Orchestration was one week for a skill that appears in most DE adverts.** It's now two: foundations, then production concerns (backfills, sensors, dynamic task mapping, monitoring, MWAA). One week gets you a DAG that runs; two gets you one that survives.","**The tail was overloaded.** CI/CD was crammed into a single Monday, and the capstone shared a week with CV and interview prep. CI/CD now pairs with data quality — a natural fit, since automated testing *is* the delivery mechanism for the tests you write — and the capstone gets two weeks.","**Where the time came from:** the standalone data-visualisation week is merged into the BI week. For a DE role, chart-selection theory earns less than orchestration depth; the essentials survive as Week 3 Friday plus the expanded BI week.","**Weeks 20–21 rewritten for Airflow 3 (July 2026).** The orchestration weeks originally described Airflow 2 patterns that no longer run. Corrected against the Airflow 3.2 docs: `PythonOperator`/`BashOperator`/`ExternalTaskSensor`/`FileSensor` now come from `apache-airflow-providers-standard`; `BaseOperator`, `BaseSensorOperator`, `TaskGroup`, `Asset` and `Connection` moved to `airflow.sdk`; **SLAs were removed** and replaced by Deadline Alerts; `catchup` defaults to `False`; a bare cron string now gets `CronTriggerTimetable` instead of `CronDataIntervalTimetable`; `execution_date` is gone from the task context in favour of `logical_date`; SubDAGs and the Sequential executor were removed; the webserver became an API server with a separate dag processor. The tool stack is unchanged — this is a version correction, not a redesign."]},{"id":"linkstatus","title":"Link verification status","tone":"plain","body":["**Documentation links are verified.** A sample across AWS (Athena partition projection, ECR push), Airflow (dynamic task mapping, callbacks), dbt (data tests) and Confluent (Kafka-Python course) was fetched directly and each returned the correct current page. Treat official-docs URLs in this file as good.","**YouTube links have now been verified too.** All 18 `youtube.com/watch` and `youtube.com/playlist` links in this plan were checked against YouTube's oEmbed endpoint on 29 July 2026: every one resolves and its title matches what the plan claims. None were substituted.","**Version currency, checked July 2026.** Airflow docs links resolve to **Airflow 3.2**, and Weeks 20–21 have been rewritten to match — see the note above. `dbt-athena` is maintained by dbt Labs at 1.10.x and remains correct; note that dbt Core 2.0 and the Rust-based Fusion engine now exist alongside classic dbt Core, and Fusion refuses to run with unresolved deprecation warnings, so keep the Week 14 project warning-clean. **Great Expectations 1.0** replaced the old `BatchRequest` + `DataContext` boilerplate with a simpler `gx.Context()` flow, so any pre-2024 GX tutorial you find for Week 23 will mislead you — follow the official docs over the walkthrough."]},{"id":"marketfacts","title":"Verified market facts (checked July 2026)","tone":"plain","list":["**Volume:** roughly **8,000–14,000 live UK vacancies** at any one time across data engineer / data engineering / analytics engineer titles, demand growing double digits year on year.","**Junior pay:** London junior DE averages around **£34,600**, typical range **£29,600–£40,900**; broader UK junior figures run **£35,000–£50,000**. All-levels London median is far higher (~£85k) — that's the climb, not the start.","**Finance premium:** banks, hedge funds and fintech pay roughly **20–30% above** retail/media equivalents.","**Certification (optional, Week 26):** AWS Certified Data Engineer – Associate (DEA-C01) — **$150 USD**, **130 minutes**, **65 questions**, pass mark **720/1000**, valid three years.","**Market data APIs — the honest state in 2026:** `yfinance` has **no official API**, works by reverse-engineering Yahoo's internal endpoints — no key, no SLA, no guarantee it works tomorrow. Fine for learning, not for anything you call production. **Alpha Vantage** free tier is **25 requests/day, 5/minute**. **Finnhub** is the most generous at **60 calls/minute**, no credit card, up to a year of history per call. **Twelve Data** gives roughly **800 calls/day**. Choose deliberately and write down why — that decision is itself an interview answer."]},{"id":"stack","title":"How the projects stack","tone":"plain","body":["**Major Project 1 — Equity Markets Analytics (Week 9).** Absorbs: the Python trade-utils module, the SQL analytical queries, the pandas cleaning notebook, the EDA charts, the `AthenaClient` class, the S3 lake layout, the QuickSight dashboard.","**Major Project 2 — Market Data ELT Pipeline (Week 19).** Absorbs everything above, plus the star schema, the dbt project, the partitioned-Parquet cost work, the Terraform stack, the Dockerfile, the packaged API-client module with retries and tests.","**Major Project 3 — Trading-Data Platform, the capstone (Weeks 25–26).** Absorbs everything, plus two-week Airflow orchestration, a Kafka streaming path, least-privilege IAM, data-quality checks with alerting, and CI/CD.","Working rhythm: **Learn ~40% → Build ~40% → Document ~15% → Review ~5%.** A week is done when its Definition of Done genuinely passes. If it isn't committed to GitHub, it didn't happen."]},{"id":"mathsscope","title":"Week 7 maths scope note, stated honestly","tone":"warn","body":["One week is the right amount of maths for a *Data Engineer* role — no junior DE interview asks you to derive anything. It is nowhere near enough for Quant Developer, which needs real linear algebra, probability, stochastic calculus and numerical methods. This week makes you literate enough to talk to quants and understand what a desk is doing. Build the rest from inside a markets-data job, with income."]},{"id":"expectation","title":"Realistic expectation","tone":"warn","body":["Skills-ready and actively interviewing within six months is realistic. A signed finance-sector offer *by* month six is the optimistic end — month six to twelve is the base case, because junior-tier competition is sharp and bank hiring cycles run long. You may be competitive for **Analytics Engineer** roles after Major Project 2, before the capstone is finished. That's why applications start in Week 10 and never stop."]},{"id":"stretch","title":"Optional stretch — not in the 26 weeks","tone":"plain","list":["**Spark on AWS Glue** — useful once data outgrows single-node tools, but not what gets a first DE role in finance. Add it after you're hired: [AWS Glue Spark jobs — official docs](https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming.html).","**kdb+/q** — the fund-track bridge. Time-series databases dominate trading firms. Know what it is and why it exists; learn it properly from inside a markets-data job."]}],"hygiene":{"title":"Repo hygiene — applies to every repo, from Week 1","gitignore_intro":"**`.gitignore` essentials** — commit this before anything else:","gitignore":".env\n.venv/\n__pycache__/\n*.pyc\n.ipynb_checkpoints/\n.terraform/\n*.tfstate\n*.tfstate.backup\ntarget/\ndbt_packages/\nlogs/\n.DS_Store","sections":[{"h":"File naming","list":["Python files and folders: `snake_case.py`. Never spaces, capitals, or dates in filenames.","Notebooks: two-digit prefix so they sort in execution order — `01_cleaning.ipynb`, `02_stats.ipynb`.","SQL: `snake_case.sql`, one file per logical model or question.","Terraform: `main.tf`, `variables.tf`, `outputs.tf`, `iam.tf`."]},{"h":"Notebook vs module","body":["Notebooks are for exploration and narrative analysis. `.py` modules are for anything reused. **If you import it twice, it belongs in a module, not a notebook.** Never import from a notebook."]},{"h":"Commits","body":["Imperative mood, one logical change each: `add rolling volatility to stats notebook`, not `updates`. Push at least once per working day."]},{"h":"README","body":["Every repo: what problem it solves, the stack, how to run it, what you found, screenshots. A reader should understand the project in 60 seconds."]},{"h":"Secrets","body":["Never committed, ever. Not in code, not in notebooks, not in `.tf` files, not in git history. Use environment variables locally and Secrets Manager in AWS."]}]},"naming":{"title":"Naming conventions — decide once, apply everywhere","head":["Thing","Pattern","Example"],"rows":[["S3 buckets","`ronald-<project>-<layer>-<env>`","`ronald-equity-analytics-raw-dev`"],["Layers","`raw` / `staging` / `curated`","pick one scheme, keep it"],["IAM roles/policies","`<project>-<service>-role` / `-policy`","`market-elt-glue-role`"],["Glue databases","`<project>_db`","`market_elt_db`"],["GitHub repos","kebab-case","`equity-markets-analytics`"],["Airflow DAG ids","`<project>_<flow>_dag`","`market_elt_daily_dag`"],["Tags on every resource","`Project`, `Environment`, `Owner`","`Owner=ronald`"]],"foot":"S3 bucket names are globally unique across all of AWS — lowercase, numbers and hyphens only, no underscores or capitals."},"phaseTable":{"title":"The five phases at a glance","head":["Phase","Weeks","Title","What it gets you"],"rows":[["**1**","1–5","Core Skills","Python, SQL and pandas at working depth, plus the OOP and advanced-SQL reps everything later assumes"],["**2**","6–10","AWS Foundations & First Project","A live data lake, the maths literacy, a dashboard — and Major Project 1 published, with applications started"],["**3**","11–19","Data Engineering Core","Modelling, dbt, cost tuning, Terraform, Docker, production Python — ending in Major Project 2, the pipeline that *is* the junior/mid DE job"],["**4**","20–24","Production Systems","Orchestration in depth, security, data quality, CI/CD and streaming — the difference between a script and a system"],["**5**","25–26","Capstone & Job Hunt","The headline project built and shipped, CV and interview prep sharpened"]],"foot":"Applications start in Week 10 and run continuously from there. Phases 3–5 are depth-building while they're in flight, not a prerequisite to applying."},"phases":[{"n":1,"title":"Core Skills","range":"Weeks 1–5","from":1,"to":5,"intro":"Python, SQL and pandas at working depth, plus the OOP and advanced-SQL reps everything later assumes. No AWS yet — the fundamentals have to be real first."},{"n":2,"title":"AWS Foundations & First Project","range":"Weeks 6–10","from":6,"to":10,"intro":"Your first real cloud storage and query layer, the maths literacy a markets team expects, a working dashboard — and Major Project 1 published. Applications start at the end of this phase, not the end of the plan."},{"n":3,"title":"Data Engineering Core","range":"Weeks 11–19","from":11,"to":19,"intro":"Where the DE title starts to earn out: modelling data properly, transforming it with dbt, tuning what it costs, provisioning it as code, containerising it, and packaging the Python that moves it. Ends in Major Project 2 — the pipeline that IS the junior/mid DE job."},{"n":4,"title":"Production Systems","range":"Weeks 20–24","from":20,"to":24,"intro":"The gap between a script and a system. Orchestration in real depth, least-privilege security, data quality that fails loudly, automated testing, and a streaming path. This phase is what separates you from a portfolio of tutorials."},{"n":5,"title":"Capstone & Job Hunt","range":"Weeks 25–26","from":25,"to":26,"intro":"Everything wired together into the headline project, then the portfolio converted into interviews. Applications have been running since Week 10 — this phase sharpens the pitch rather than starting it."}],"weeks":[{"n":1,"phase":1,"title":"Python Fundamentals","goal":"Confident writing plain Python — types, control flow, functions, comprehensions, error handling.","days":[["Mon","Variables, strings, numbers, booleans, lists, dicts, tuples, sets; `if`/`elif`/`else`. Store trades as dicts in a list; print only those above a price threshold."],["Tue","`for` and `while` loops; `range`, `enumerate`, `zip`. Loop 1–100 skipping multiples of 3."],["Wed","Functions: parameters, default arguments, return values, docstrings, scope."],["Thu","List/dict comprehensions. Error handling: `try`/`except`/`finally`, raising custom exceptions with useful messages."],["Fri","Modules and imports: split functions into a separate `.py` file and import them. Commit."]],"files":["src/trade_utils.py","week01/practice.py"],"mini":{"n":1,"name":"`trade_utils.py`","desc":"Percentage return between two prices; a trade-size classifier with a default volume threshold; a currency formatter; each raising a clear `ValueError` on bad input.","feeds":"Feeds Major Project 1 — you'll import this later, not rewrite it.","mp":[1]},"resources":[{"day":null,"md":"Course: [Learn Python — Full Course for Beginners (freeCodeCamp)](https://www.youtube.com/watch?v=rfscVS0vtbw)"},{"day":null,"md":"Reference: [Real Python — tutorials and reference](https://realpython.com/)"},{"day":null,"md":"Practice: [Exercism — Python track (graded, with tests)](https://exercism.org/tracks/python)"},{"day":"Thu","md":"[Real Python: Python Exceptions](https://realpython.com/python-exceptions/)"}],"dod":"Three utility functions written and hand-tested; a comprehension used where it genuinely improves readability; `try`/`except` with a custom exception; the module imports cleanly from another file; committed.","vidbase":"https://www.youtube.com/watch?v=rfscVS0vtbw","vidlabel":"freeCodeCamp Python","chapters":{"Mon":[[906,"Variables & Data Types"],[3790,"Lists"],[6006,"If Statements"],[7637,"Dictionaries"]],"Tue":[[8053,"While Loop"],[9164,"For Loops"]],"Wed":[[5055,"Functions"],[5651,"Return Statement"]],"Thu":[[11057,"Try / Except"]],"Fri":[[12493,"Modules & Pip"]]},"data":[{"title":"Sample trades to work with on Monday","lang":"python","note":"Paste into `week01/practice.py`. Same five tickers you'll use all the way to Week 26. Monday's task is to print only those above a price threshold.","code":"# week01/practice.py\ntrades = [\n    {\"ticker\": \"AAPL\", \"price\": 230.02, \"volume\": 2500, \"side\": \"SELL\"},\n    {\"ticker\": \"MSFT\", \"price\": 430.23, \"volume\": 2500, \"side\": \"BUY\"},\n    {\"ticker\": \"JPM\",  \"price\": 218.81, \"volume\": 1500, \"side\": \"SELL\"},\n    {\"ticker\": \"XOM\",  \"price\": 113.61, \"volume\": 1000, \"side\": \"SELL\"},\n    {\"ticker\": \"JNJ\",  \"price\": 158.15, \"volume\": 2500, \"side\": \"BUY\"},\n    {\"ticker\": \"AAPL\", \"price\": 219.86, \"volume\": 7500, \"side\": \"BUY\"},\n    {\"ticker\": \"MSFT\", \"price\": 452.56, \"volume\": 1500, \"side\": \"SELL\"},\n    {\"ticker\": \"JPM\",  \"price\": 226.68, \"volume\": 1000, \"side\": \"BUY\"},\n    {\"ticker\": \"XOM\",  \"price\": 115.70, \"volume\": 1000, \"side\": \"SELL\"},\n    {\"ticker\": \"JNJ\",  \"price\": 166.07, \"volume\": 750,  \"side\": \"SELL\"},\n]","check":"Filtering for price > 200 should leave **7** trades. Total volume across all ten is **22,750**."}],"dayfiles":{"Mon":{"act":"new","path":"week01/practice.py","note":"Create the `week01/` folder too — this is your scratch file all week."},"Tue":{"act":"continue","path":"week01/practice.py"},"Wed":{"act":"continue","path":"week01/practice.py"},"Thu":{"act":"continue","path":"week01/practice.py"},"Fri":{"act":"new","path":"src/trade_utils.py","note":"Create the `src/` folder. Move the three functions out of `practice.py` and import them back — that move *is* the exercise."}}},{"n":2,"phase":1,"title":"SQL Fundamentals","goal":"Fluent with filtering, joins, aggregation and grouping — the base Week 4 builds on.","days":[["Mon","`SELECT`, `WHERE`, `ORDER BY`, `LIMIT`; `AND`/`OR`/`IN`/`BETWEEN`/`LIKE`; `NULL` handling and why `= NULL` never works."],["Tue","Joins: `INNER`, `LEFT`, `RIGHT`, `FULL`. Create an `instrument → sector` lookup and join it; watch row counts change between INNER and LEFT."],["Wed","`GROUP BY`, `HAVING` vs `WHERE`, `COUNT`/`SUM`/`AVG`/`MIN`/`MAX`; grouping on multiple columns."],["Thu","Subqueries in `WHERE` and in `FROM`; when a join reads clearer than a subquery."],["Fri","`CASE WHEN`, date functions, string functions. Total volume and average price per instrument per month."]],"files":["sql/analytics/*.sql  (five files, snake_case, one per question)","sql/ddl/create_trades.sql"],"mini":{"n":2,"name":"`sql/analytics/` query library","desc":"Five commented, reusable queries, each with a one-line comment stating the question it answers.","feeds":"Feeds Major Project 1 — these become your Athena queries, near-unchanged.","mp":[1]},"notes":["Where to run it: a free browser sandbox (DB Fiddle) or BigQuery. Write your own `CREATE TABLE` and `INSERT` 40–60 rows across five instruments and six months."],"resources":[{"day":null,"md":"Course: [SQL Tutorial — Full Database Course for Beginners (freeCodeCamp)](https://www.youtube.com/watch?v=HXV3zeQKqGY)"},{"day":null,"md":"Reference: [W3Schools — SQL Tutorial](https://www.w3schools.com/sql/)"},{"day":null,"md":"Practice: [SQLZoo](https://sqlzoo.net/) and [SQLBolt](https://sqlbolt.com/)"},{"day":null,"md":"Sandbox: [DB Fiddle](https://www.db-fiddle.com/)"}],"dod":"Four join types demonstrated and explained; a `GROUP BY` + `HAVING` query correct; a subquery used appropriately; queries committed and commented.","vidbase":"https://www.youtube.com/watch?v=HXV3zeQKqGY","vidlabel":"freeCodeCamp SQL","chapters":{"Mon":[[6971,"Basic Queries"]],"Tue":[[10896,"Joins"]],"Wed":[[9027,"More Basic Queries (aggregates & GROUP BY)"]],"Thu":[[11509,"Nested Queries"]]},"data":[{"title":"Schema — run this first","lang":"sql","note":"Three tables. `venues` and the six-row `instruments` lookup are what Tuesday's join exercise needs. Works as-is on DB Fiddle (PostgreSQL) and BigQuery.","code":"CREATE TABLE venues (\n  venue_code  VARCHAR(4)   PRIMARY KEY,\n  venue_name  VARCHAR(50)  NOT NULL,\n  country     VARCHAR(2)   NOT NULL\n);\n\nCREATE TABLE instruments (\n  instrument_id  INTEGER      PRIMARY KEY,\n  ticker         VARCHAR(6)   NOT NULL UNIQUE,\n  name           VARCHAR(60)  NOT NULL,\n  sector         VARCHAR(30)  NOT NULL\n);\n\nCREATE TABLE trades (\n  trade_id       INTEGER      PRIMARY KEY,\n  instrument_id  INTEGER      NOT NULL REFERENCES instruments(instrument_id),\n  trade_date     DATE         NOT NULL,\n  price          NUMERIC(10,2) NOT NULL,\n  volume         INTEGER      NOT NULL,\n  venue_code     VARCHAR(4)   NOT NULL REFERENCES venues(venue_code),\n  side           VARCHAR(4)   NOT NULL\n);"},{"title":"Reference data","lang":"sql","note":"Six instruments, but only five of them ever trade. `NVDA` exists in the lookup and nowhere else — that is the point of it.","code":"INSERT INTO venues (venue_code, venue_name, country) VALUES\n  ('XNAS', 'Nasdaq', 'US'),\n  ('XNYS', 'New York Stock Exchange', 'US');\n\nINSERT INTO instruments (instrument_id, ticker, name, sector) VALUES\n  (1, 'AAPL', 'Apple Inc.',           'Technology'),\n  (2, 'MSFT', 'Microsoft Corp.',      'Technology'),\n  (3, 'JPM',  'JPMorga
