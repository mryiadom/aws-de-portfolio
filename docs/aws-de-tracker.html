ly` vs `transform` vs `agg`. Boolean indexing and `.isin()`. Then first charts: `.plot()` straight off a DataFrame — line, bar, histogram — enough to see your own data without leaving the notebook."]],"files":["notebooks/01_cleaning.ipynb"],"mini":{"n":3,"name":"`notebooks/01_cleaning.ipynb`","desc":"Load raw trades, deliberately inject missing values and a duplicate row, then detect and fix both defensibly — per-instrument fills, not a global mean. Document *why* each choice.","feeds":"Feeds Major Projects 1 and 2.","mp":[1,2]},"resources":[{"day":null,"md":"Course: [Complete Pandas Data Science Tutorial (Keith Galli)](https://www.youtube.com/watch?v=2uvysYbKdjM)"},{"day":null,"md":"Reference: [pandas — official documentation](https://pandas.pydata.org/docs/)"},{"day":null,"md":"Practice: [Kaggle — Pandas micro-course](https://www.kaggle.com/learn/pandas)"},{"day":"Thu","md":"[pandas: Time series / date functionality](https://pandas.pydata.org/docs/user_guide/timeseries.html)"},{"day":"Fri","md":"[pandas: Chart visualization](https://pandas.pydata.org/docs/user_guide/visualization.html)"}],"dod":"DataFrame cleaned of NaNs and duplicates with justified methods; `groupby`+`agg` and `merge` both used correctly; a rolling window computed per instrument via `transform`; three basic charts produced; notebook committed with written reasoning.","vidbase":"https://www.youtube.com/watch?v=2uvysYbKdjM","vidlabel":"Keith Galli pandas","chapters":{"Mon":[[505,"Loading DataFrames from Files"],[928,"Accessing Data | .loc() .iloc()"]],"Tue":[[3513,"Handling Null Values (NaNs)"]],"Wed":[[3042,"Merging & Concatenating Data"],[3947,"Aggregating Data | groupby()"],[4104,"Aggregating Data | Pivot Tables"]],"Thu":[[4228,"Groupby combined with Datetime Operations"]],"Fri":[[1452,"Filtering Data | Numeric & Multiple Conditions"],[4478,"Advanced Functionality | .shift() .rank()"]]},"data":[{"title":"Build the messy CSV you'll clean","lang":"python","note":"Run once to produce `data/raw_trades.csv`. It exports the same 54 trades, then injects exactly the two problems Tuesday asks you to detect and fix. Keep the script — being able to regenerate dirty input is how you test a cleaning notebook.","code":"# scripts/make_raw_trades.py  -- run once\nimport pandas as pd, numpy as np\n\n# export your trades table to data/trades_clean.csv first, or rebuild it here\ndf = pd.read_csv(\"data/trades_clean.csv\", parse_dates=[\"trade_date\"])\n\nrng = np.random.default_rng(20260729)\n\n# 1. null out 6 prices and 3 volumes, spread across instruments\nprice_idx = rng.choice(df.index, size=6, replace=False)\nvol_idx   = rng.choice(df.index.difference(price_idx), size=3, replace=False)\ndf.loc[price_idx, \"price\"] = np.nan\ndf.loc[vol_idx,   \"volume\"] = np.nan\n\n# 2. duplicate two whole rows\ndupes = df.sample(2, random_state=7)\ndf = pd.concat([df, dupes], ignore_index=True)\n\n# 3. make one column the wrong dtype, so .info() tells you something\ndf[\"volume\"] = df[\"volume\"].astype(\"object\")\n\ndf.to_csv(\"data/raw_trades.csv\", index=False)\nprint(df.shape)","check":"`raw_trades.csv` should have **56** rows (54 + 2 duplicates), **6** null prices and **3** null volumes. After `drop_duplicates()` you should be back to 54. Filling price per-instrument rather than with a global mean should change AAPL's mean by roughly £2–4 versus the global fill — that gap is the point of Tuesday."}],"dayfiles":{"Mon":{"act":"new","path":"notebooks/01_cleaning.ipynb","note":"Create the `notebooks/` folder. Two-digit prefix so notebooks sort in execution order."},"Tue":{"act":"continue","path":"notebooks/01_cleaning.ipynb"},"Wed":{"act":"continue","path":"notebooks/01_cleaning.ipynb"},"Thu":{"act":"continue","path":"notebooks/01_cleaning.ipynb"},"Fri":{"act":"continue","path":"notebooks/01_cleaning.ipynb"}}},{"n":4,"phase":1,"title":"Advanced SQL: Window Functions, CTEs, Optimisation","goal":"Where beginners and professionals separate. Standard ANSI SQL that runs near-unchanged on Athena, Snowflake, BigQuery and Postgres.","days":[["Mon","Window functions: `ROW_NUMBER`, `RANK`, `DENSE_RANK`, `NTILE`; `OVER (PARTITION BY … ORDER BY …)`."],["Tue","`LAG`/`LEAD` for period-over-period comparison; moving averages with a windowed frame (`ROWS BETWEEN`)."],["Wed","CTEs (`WITH`), including chained CTEs; rewrite a messy nested query as readable CTEs. Recursive CTEs conceptually."],["Thu","Daily returns and a 7-day moving average; rank assets by return within each month using a window partitioned by month."],["Fri","Query performance basics: what a scan costs, why filtering early matters, reading a query plan."]],"files":["sql/analytics/returns_analysis.sql"],"mini":{"n":4,"name":"`returns_analysis.sql`","desc":"One ~100-line multi-CTE analytical query answering a real markets question end-to-end, fully commented.","feeds":"Feeds Major Project 1 — its analytical core.","mp":[1]},"resources":[{"day":null,"md":"Course: [SQL Window Functions (LEAD/LAG, RANK) + CTEs in 60 min](https://www.youtube.com/watch?v=dqwhNcZoMOQ)"},{"day":null,"md":"Practice: [Mode SQL Tutorial — interactive window functions & CTEs](https://mode.com/sql-tutorial/)"},{"day":null,"md":"Drills: [DataLemur — SQL interview questions](https://datalemur.com/)"}],"dod":"A window-function query (rank or lag) works; a nested query rewritten as CTEs; the ~100-line query committed and commented.","data":[{"title":"Daily OHLCV — the file Weeks 4, 6, 7 and 8 all use","lang":"python","note":"Generates ~130 trading days of daily bars for the first five tickers, as a random walk seeded per ticker so it is reproducible. This is the last synthetic dataset — Week 9 replaces it with real API data using **the same columns**.","code":"# scripts/make_prices.py  -- run once\nimport pandas as pd, numpy as np\n\nBASE = {\"AAPL\": 225.0, \"MSFT\": 415.0, \"JPM\": 212.0, \"XOM\": 118.0, \"JNJ\": 158.0}\nDAYS = pd.bdate_range(\"2026-01-01\", \"2026-06-30\")   # business days only\n\nrows = []\nfor i, (ticker, base) in enumerate(BASE.items()):\n    rng = np.random.default_rng(1000 + i)\n    close = base\n    for d in DAYS:\n        drift = rng.normal(0.0004, 0.014)           # ~1.4% daily vol\n        close = round(close * (1 + drift), 2)\n        o = round(close * (1 + rng.normal(0, 0.004)), 2)\n        h = round(max(o, close) * (1 + abs(rng.normal(0, 0.005))), 2)\n        l = round(min(o, close) * (1 - abs(rng.normal(0, 0.005))), 2)\n        rows.append({\"ticker\": ticker, \"price_date\": d.date(),\n                     \"open\": o, \"high\": h, \"low\": l, \"close\": close,\n                     \"volume\": int(rng.integers(5_000_000, 60_000_000))})\n\npd.DataFrame(rows).to_csv(\"data/prices.csv\", index=False)","check":"**5 tickers × ~130 business days ≈ 650 rows**. `high` should never be below `close` and `low` never above it — worth asserting, because that is exactly the kind of validity check Week 23 asks you to automate. Your 7-day moving average will be null for the first 6 rows of each ticker; if it is null for only the first 6 rows *overall*, your window is missing `PARTITION BY ticker`."}],"dayfiles":{"Mon":{"act":"continue","path":"sql/analytics/","note":"Scratch queries in the existing folder — nothing new to create yet."},"Tue":{"act":"continue","path":"sql/analytics/"},"Wed":{"act":"continue","path":"sql/analytics/"},"Thu":{"act":"new","path":"sql/analytics/returns_analysis.sql","note":"The week's real deliverable. Start it today, finish it tomorrow."},"Fri":{"act":"continue","path":"sql/analytics/returns_analysis.sql"}}},{"n":5,"phase":1,"title":"Python OOP for Data Engineers","goal":"Comfortable writing classes, and a reusable client class carried through the rest of the plan. OOP earns its place because pipelines are full of things that hold state and do repeated work — API clients, DB connections.","days":[["Mon","Why OOP for engineering rather than analysis: classes model state plus repeated behaviour. Classes vs functions."],["Tue","Attributes, methods, `__init__`, `self`, instance vs class attributes. Build a small `Ticker` class."],["Wed","Encapsulation and composition: a `MarketDataClient` wrapping a requests session with retry configuration. Properties."],["Thu","Inheritance vs composition — why \"prefer composition\" is the default, and where inheritance genuinely fits (you'll subclass Airflow's `BaseOperator` in Week 21). Dunder methods: `__repr__`, `__eq__`."],["Fri","Type hints, docstrings, and structuring a package with `__init__.py`."]],"files":["src/athena_client.py","src/__init__.py","src/ticker.py"],"mini":{"n":5,"name":"`src/athena_client.py`","desc":"An `AthenaClient` class with `.run_query()` and `.to_dataframe()`, type-hinted and documented.","feeds":"Feeds all three major projects.","mp":[1,2,3]},"resources":[{"day":null,"md":"Course: [Python OOP — Full Course for Beginners (freeCodeCamp)](https://www.youtube.com/watch?v=Ej_02ICOIgs)"},{"day":null,"md":"Reference: [Real Python — OOP in Python 3](https://realpython.com/python3-object-oriented-programming/)"},{"day":null,"md":"Practice: [Codewars — OOP kata](https://www.codewars.com/)"},{"day":"Fri","md":"[Python Packaging User Guide](https://packaging.python.org/en/latest/)"}],"dod":"A class with attributes and methods works; `AthenaClient` committed to `/src`; you can explain in your own words when composition beats inheritance.","vidbase":"https://www.youtube.com/watch?v=Ej_02ICOIgs","vidlabel":"freeCodeCamp OOP","chapters":{"Mon":[[0,"Getting Started with Classes"],[6660,"OOP Principles"]],"Tue":[[731,"Constructor, __init__"],[3035,"Class vs Static Methods"]],"Wed":[[5414,"Getters and Setters"]],"Thu":[[4402,"Inheritance"]]},"data":[{"title":"What your Ticker and AthenaClient work against","lang":"python","note":"No new dataset this week — the classes wrap what you already have. Use this as the shape your `Ticker` class should model.","code":"# the five instruments your Ticker class should be able to represent\nINSTRUMENTS = [\n    {\"ticker\": \"AAPL\", \"name\": \"Apple Inc.\",           \"sector\": \"Technology\"},\n    {\"ticker\": \"MSFT\", \"name\": \"Microsoft Corp.\",      \"sector\": \"Technology\"},\n    {\"ticker\": \"JPM\",  \"name\": \"JPMorgan Chase & Co.\", \"sector\": \"Financials\"},\n    {\"ticker\": \"XOM\",  \"name\": \"Exxon Mobil Corp.\",    \"sector\": \"Energy\"},\n    {\"ticker\": \"JNJ\",  \"name\": \"Johnson & Johnson\",    \"sector\": \"Healthcare\"},\n]","check":"Two `Ticker` objects built from the same dict should compare equal once you have written `__eq__`, and `repr()` should be something you would be happy to see in a log line — `Ticker('AAPL', sector='Technology')`, not `<object at 0x7f…>`."}],"dayfiles":{"Mon":{"act":"none","note":"Reading and notes only — no file today."},"Tue":{"act":"new","path":"src/ticker.py","note":"Goes in the existing `src/` folder from Week 1."},"Wed":{"act":"new","path":"src/athena_client.py","note":"The class you will still be importing in Week 25."},"Thu":{"act":"continue","path":"src/athena_client.py","note":"Add `__repr__` and `__eq__` here."},"Fri":{"act":"new","path":"src/__init__.py","note":"Turns `src/` into a real package. Add type hints across the files you already wrote."}}},{"n":6,"phase":2,"title":"S3 & Athena: Building the Lake","goal":"A working data lake layout with Athena querying it, driven from Python via your Week-5 class.","days":[["Mon","S3 concepts: buckets, keys, prefixes, storage classes, lifecycle rules. Why prefix design *is* your partitioning strategy later."],["Tue","Athena first-run setup: set a query results location (a folder in your bucket), pick or create a database. `default` isn't always pre-populated in a fresh account — run `CREATE DATABASE` if the dropdown is empty. Work the official Getting Started walkthrough for `CREATE EXTERNAL TABLE` over a public sample dataset."],["Wed","Create an external table over *your own* CSV in S3. SerDes, column types, and what happens when the schema doesn't match the file."],["Thu","The Glue Data Catalog: what it is, how Athena uses it, running a crawler vs declaring a table by hand."],["Fri","Drive Athena from Python with `AthenaClient`; return results as a DataFrame."]],"files":["sql/ddl/create_external_trades.sql","scripts/query_athena.py","NOTES.md"],"mini":{"n":6,"name":"`raw` layer live","desc":"Trades data in S3 under a proper `raw/` prefix, an Athena table over it, and a Python script querying it through `AthenaClient`.","feeds":"Major Project 1's storage and query foundation.","mp":[1]},"resources":[{"day":"Tue","md":"[Get started with Amazon Athena — official docs, incl. CREATE EXTERNAL TABLE](https://docs.aws.amazon.com/athena/latest/ug/getting-started.html)"},{"day":"Thu","md":"[Tutorial: Adding an AWS Glue crawler — official docs](https://docs.aws.amazon.com/glue/latest/dg/tutorial-add-crawler.html)"},{"day":null,"md":"Reference: [Amazon S3 — user guide](https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html)"},{"day":null,"md":"Practice: [AWS Skill Builder — free hands-on labs](https://skillbuilder.aws/)"}],"dod":"A correctly-named bucket with a sane prefix layout; an external table over your own S3 data; one query run from Python via `AthenaClient`; logged in `NOTES.md` and committed.","data":[{"title":"S3 layout — decide the prefixes before you upload","lang":"text","note":"Upload `data/prices.csv` under this layout. The prefix design is your partitioning strategy in Week 15, so getting it right now saves a rebuild later.","code":"s3://ronald-equity-analytics-raw-dev/\n└── raw/\n    └── prices/\n        └── ingest_date=2026-07-29/\n            └── prices.csv"},{"title":"The external table over it","lang":"sql","note":"Note `skip.header.line.count` — without it your header row becomes a data row and every numeric column silently becomes a string.","code":"CREATE EXTERNAL TABLE IF NOT EXISTS market_elt_db.raw_prices (\n  ticker      string,\n  price_date  date,\n  open        double,\n  high        double,\n  low         double,\n  close       double,\n  volume      bigint\n)\nROW FORMAT SERDE 'org.apache.hadoop.hive.serde2.OpenCSVSerde'\nWITH SERDEPROPERTIES ('separatorChar' = ',', 'quoteChar' = '\"')\nLOCATION 's3://ronald-equity-analytics-raw-dev/raw/prices/ingest_date=2026-07-29/'\nTBLPROPERTIES ('skip.header.line.count' = '1');","check":"`SELECT COUNT(*)` should return the same ~650 as your CSV. If it returns 651 you have not skipped the header; if every `close` comes back `NULL`, the OpenCSVSerde is reading them as strings — it types everything as string by default, which is a real interview talking point about schema-on-read."}],"dayfiles":{"Mon":{"act":"new","path":"NOTES.md","note":"Repo root. Your running log of AWS decisions — bucket names, prefixes, why."},"Tue":{"act":"continue","path":"NOTES.md","note":"Record the Athena query-results location you set. You will forget it otherwise."},"Wed":{"act":"new","path":"sql/ddl/create_external_trades.sql"},"Thu":{"act":"continue","path":"NOTES.md","note":"Write down crawler vs hand-declared table, and which you chose."},"Fri":{"act":"new","path":"scripts/query_athena.py","note":"Create the `scripts/` folder. This *imports* `src/athena_client.py` from Week 5 — do not rewrite the class."}}},{"n":7,"phase":2,"title":"Statistics & Maths for a Quant-Track Engineer","goal":"Correlation and one hypothesis test, plus real intuition for vectors and matrices. Conceptual first, notation second.","callout":{"title":"Scope note, stated honestly","body":"One week is the right amount of maths for a *Data Engineer* role — no junior DE interview asks you to derive anything. It is nowhere near enough for Quant Developer, which needs real linear algebra, probability, stochastic calculus and numerical methods. This week makes you literate enough to talk to quants and understand what a desk is doing. Build the rest from inside a markets-data job, with income."},"days":[["Mon","Mean, variance, standard deviation, distributions; skew and why financial returns aren't normally distributed."],["Tue","Correlation vs covariance; Pearson vs Spearman; a t-test; what p-values do and don't tell you."],["Wed","Vectors and matrices intuitively: linear combinations, what a matrix *does* to a vector. No proofs."],["Thu","A covariance matrix is just the pairwise covariances of your basket. Compute one in numpy and interpret it in plain English."],["Fri","Volatility as standard deviation of returns; annualising it; rolling volatility."]],"files":["notebooks/02_stats.ipynb"],"mini":{"n":7,"name":"`notebooks/02_stats.ipynb`","desc":"Compare two assets' return distributions, test whether the difference is significant, compute and interpret the covariance matrix.","feeds":"Feeds Major Project 1's correlation and volatility outputs.","mp":[1]},"resources":[{"day":"Tue","md":"[StatQuest — p-values, clearly explained](https://www.youtube.com/watch?v=vemZtEM63GY)"},{"day":"Wed","md":"[3Blue1Brown — Essence of Linear Algebra (playlist)](https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab)"},{"day":null,"md":"Reference: [scipy.stats — official documentation](https://docs.scipy.org/doc/scipy/reference/stats.html)"},{"day":null,"md":"Practice: [Khan Academy — Statistics and Probability](https://www.khanacademy.org/math/statistics-probability)"}],"dod":"Correlation and a t-test run correctly; a covariance matrix computed and explained in plain English; you can describe intuitively what a matrix does to a vector.","dayfiles":{"Mon":{"act":"new","path":"notebooks/02_stats.ipynb"},"Tue":{"act":"continue","path":"notebooks/02_stats.ipynb"},"Wed":{"act":"continue","path":"notebooks/02_stats.ipynb"},"Thu":{"act":"continue","path":"notebooks/02_stats.ipynb"},"Fri":{"act":"continue","path":"notebooks/02_stats.ipynb"}}},{"n":8,"phase":2,"title":"Visualisation Principles & BI (QuickSight)","goal":"Charts that answer a question rather than decorate one, plus an interactive dashboard reading live from Athena.","days":[["Mon","Chart-type selection: comparison, distribution, relationship, composition, change-over-time. Decide on paper which fits three questions about your trades data before building. Then what makes a chart misleading — truncated axes, dual axes, cherry-picked ranges — and colourblind-safe palettes."],["Tue","matplotlib/seaborn properly: figure/axes objects, labels, titles, legends, annotation, saving programmatically. Title states the finding, not the variable."],["Wed","QuickSight setup and **the permissions gotcha**: QuickSight cannot see your data until you separately grant access via profile menu → *Manage QuickSight* → *Security & permissions* → enable Athena and tick the specific S3 buckets. Distinct from any IAM role elsewhere, and the most common silent failure. Connect a dataset; direct query vs SPICE and the cost/freshness trade-off."],["Thu","Build charts: time-series, KPI cards, a detail table. Calculated fields. Then interactivity: parameters, date-range controls, a ticker filter."],["Fri","Layout, styling, publishing; screenshot into the repo. Produce two finished, labelled charts with written captions stating the finding."]],"files":["notebooks/03_eda.ipynb","docs/screenshots/dashboard.png"],"mini":{"n":8,"name":"EDA notebook + the dashboard","desc":"Exploratory pass (distribution per instrument, volume over time, price relationships) with a written paragraph of what you found, plus a QuickSight dashboard with ticker selector and date range.","feeds":"Major Project 1's written-insight and serving layers.","mp":[1]},"resources":[{"day":null,"md":"Course: [Data Visualization using Matplotlib and Seaborn](https://www.youtube.com/watch?v=FN78JowwpSY)"},{"day":null,"md":"Reference: [seaborn — official documentation](https://seaborn.pydata.org/)"},{"day":null,"md":"Practice: [Kaggle — Data Visualization micro-course](https://www.kaggle.com/learn/data-visualization)"},{"day":"Mon","md":"[Matplotlib: choosing colormaps](https://matplotlib.org/stable/users/explain/colors/colormaps.html)"},{"day":"Wed","md":"[Insufficient permissions when using Athena with QuickSight — official troubleshooting](https://docs.aws.amazon.com/quicksight/latest/user/troubleshoot-athena-insufficient-permissions.html)"},{"day":null,"md":"Walkthrough: [Connecting Amazon Athena to QuickSight](https://www.youtube.com/watch?v=WXpoq0A0UGk)"}],"dod":"Three chart types matched correctly to three questions; one misleading chart identified and explained; a colourblind-safe palette used; dashboard connected to Athena with working ticker and date filters; screenshot committed; you can state the SPICE vs direct-query trade-off.","vidbase":"https://www.youtube.com/watch?v=FN78JowwpSY","vidlabel":"Matplotlib & Seaborn","chapters":{"Tue":[[70,"Introduction to Matplotlib"],[6260,"Data Visualization using Seaborn"]]},"dayfiles":{"Mon":{"act":"none","note":"Paper and pen — decide the three chart types before you open an editor."},"Tue":{"act":"new","path":"notebooks/03_eda.ipynb"},"Wed":{"act":"none","note":"QuickSight console. Log the permissions steps in `NOTES.md` when you hit the gotcha."},"Thu":{"act":"none","note":"QuickSight console."},"Fri":{"act":"new","path":"docs/screenshots/dashboard.png","note":"Create `docs/` and `docs/screenshots/`. Also finish `notebooks/03_eda.ipynb` today."}}},{"n":9,"phase":2,"title":"MAJOR PROJECT 1: Equity Markets Analytics","major":1,"goal":"Public equities → S3 → Athena (via `AthenaClient`) → pandas → QuickSight → a written insight. Published on GitHub.","research_intro":"**Research before writing any code** — the step most plans hand-wave, and an interview answer in itself:","research":["Which free source gives daily OHLCV for ~10 US stocks without hitting a wall, and *why that one*? (Alpha Vantage's 25/day is tight; yfinance is unofficial and unguaranteed; Finnhub allows 60/min.)","What does one ticker's response actually contain — columns, grain, timezone?","What's your usage versus the free-tier limit? Headroom to re-run?","What breaks if a ticker returns nothing, and how will you handle it?"],"days":[["Mon","Acquisition research; decide and document the source; new repo `equity-markets-analytics`."],["Tue","Pull ~10 tickers; land raw files in S3 under `raw/`; define the Athena table."],["Wed","Analytical SQL via `AthenaClient`: returns, volatility, correlations (Weeks 4 + 7 combined)."],["Thu","pandas notebook for deeper analysis; two clean, labelled charts (Week 8 standards)."],["Fri","QuickSight dashboard; write the insight paragraph; README; commit."]],"tree_title":"Target repo tree — `equity-markets-analytics`","tree":"equity-markets-analytics/\n├── README.md\n├── requirements.txt\n├── .gitignore\n├── src/\n│   ├── __init__.py\n│   ├── athena_client.py\n│   ├── trade_utils.py\n│   └── ingest.py\n├── sql/\n│   ├── ddl/create_external_prices.sql\n│   └── analytics/returns_analysis.sql\n├── notebooks/\n│   ├── 01_cleaning.ipynb\n│   ├── 02_stats.ipynb\n│   └── 03_eda.ipynb\n└── docs/\n    ├── screenshots/dashboard.png\n    └── findings.md","spec":"Raw price files in a correctly-named bucket (`raw` layer) · an Athena table via the Glue catalog, queried through `AthenaClient` · returns and volatility per stock · a correlation matrix across the basket · a QuickSight dashboard · a one-paragraph written finding.","resources":[{"day":null,"md":"[Finnhub — API documentation](https://finnhub.io/docs/api) and [finnhub-python client](https://github.com/Finnhub-Stock-API/finnhub-python) — most generous free tier (60 calls/min)"},{"day":null,"md":"[Alpha Vantage — API documentation](https://www.alphavantage.co/documentation/) — 25/day, 5/min"},{"day":null,"md":"[yfinance — PyPI](https://pypi.org/project/yfinance/) — unofficial, no SLA"},{"day":null,"md":"[boto3 — S3 client reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/s3.html)"}],"dod":"Runs end-to-end and is reproducible; the dashboard lets you pick a ticker; the README explains it in 60 seconds; the written insight states something true and specific.","data":[{"title":"What one real API response actually contains","lang":"json","note":"Before you write ingestion code, pull **one** ticker by hand and look at it. This is Finnhub's daily candle shape — arrays, not objects, indexed positionally. Alpha Vantage returns a nested dict keyed by date instead. Knowing which you chose and why is the Week 9 research question.","code":"{\n  \"c\": [225.31, 227.02, 224.88],      // close\n  \"h\": [226.90, 228.44, 226.10],      // high\n  \"l\": [223.05, 224.71, 223.02],      // low\n  \"o\": [224.10, 225.66, 225.90],      // open\n  \"s\": \"ok\",                          // status - \"no_data\" when empty\n  \"t\": [1767225600, 1767312000, 1767398400],   // UNIX seconds, UTC\n  \"v\": [42817300, 38290100, 51004200]          // volume\n}","check":"Three things to write down before coding: the timestamps are **UNIX seconds in UTC**, so a naive `to_datetime` gives you 1970; `\"s\": \"no_data\"` is how an empty ticker fails, not an HTTP error, so `response.ok` is not enough; and the arrays are **parallel** — index 0 of `c` matches index 0 of `t`. Landing this untouched in `raw/` is what lets you re-parse without re-calling the API."}],"dayfiles":{"Mon":{"act":"new","path":"equity-markets-analytics/","note":"New repo, kebab-case. Commit `.gitignore`, `README.md` and `requirements.txt` before any code."},"Tue":{"act":"reuse","path":"src/athena_client.py · src/trade_utils.py","note":"Copy in from Weeks 5 and 1. New today: `src/ingest.py` and `sql/ddl/create_external_prices.sql`."},"Wed":{"act":"reuse","path":"sql/analytics/returns_analysis.sql","note":"Carried over from Week 4, adapted to the real Athena table."},"Thu":{"act":"reuse","path":"notebooks/01_cleaning.ipynb · 02_stats.ipynb · 03_eda.ipynb","note":"Carried over from Weeks 3, 7 and 8."},"Fri":{"act":"new","path":"docs/findings.md","note":"Plus `docs/screenshots/dashboard.png` and a rewritten `README.md`."}}},{"n":10,"phase":2,"title":"Project 1 Polish + Start Applying","goal":"Publish Project 1 properly and get applications in flight. Applications convert over weeks — starting now means offers land while you're still building.","days":[["Mon","Clean the repo; strong README: problem, stack, architecture sketch, findings, screenshots."],["Tue","Record a 2-minute walkthrough (Loom or screen capture)."],["Wed","Pin the repo; tidy your GitHub profile; profile README."],["Thu","Draft CV bullets in tool + action + result form. Frame professional GCP/BigQuery/Dataform work explicitly as **multi-cloud strength** — two hyperscalers reads as more senior than one."],["Fri","Apply to 5–10 roles: Analytics Engineer and unprefixed Data Engineer as the target, Junior DE as the floor. Set up a tracking sheet: company, role, date, stage, notes."]],"files":["README.md  (rewritten)","docs/walkthrough.md","application tracker (outside the repo)"],"resources":[{"day":null,"md":"[How to Create a Professional GitHub README Profile](https://www.youtube.com/watch?v=rCt9DatF63I)"},{"day":null,"md":"[Make a README — README guidance](https://www.makeareadme.com/)"},{"day":null,"md":"[Loom — free screen recording](https://www.loom.com/)"}],"dod":"README with screenshots live; repo pinned; walkthrough recorded; first applications sent and tracked.","callout":{"title":"From here on","body":"Applications run in parallel every week. Treat the remaining weeks as depth-building while they're in flight, not a prerequisite to applying."},"vidbase":"https://www.youtube.com/watch?v=rCt9DatF63I","vidlabel":"GitHub profile README","chapters":{"Wed":[[45,"How to create a GitHub Readme Profile"],[387,"Adding GIFs and images"]]},"dayfiles":{"Mon":{"act":"continue","path":"README.md","note":"Full rewrite, not a tidy-up."},"Tue":{"act":"new","path":"docs/walkthrough.md","note":"Holds the link to the recording; the video itself lives on Loom, not in the repo."},"Wed":{"act":"new","path":"<your-username>/<your-username>","note":"A separate repo named after your username — that is what GitHub renders as your profile README."},"Thu":{"act":"new","path":"CV (outside the repo)","note":"Never commit your CV — it has your address and phone number in it."},"Fri":{"act":"new","path":"Application tracker (outside the repo)","note":"Spreadsheet: company, role, date, stage, notes."}}},{"n":11,"phase":3,"title":"Data Modelling & Normalisation","goal":"A 3NF relational schema and ER diagram for a trading dataset.","days":[["Mon","Entities, attributes, relationships; primary and foreign keys; cardinality."],["Tue","1NF, 2NF, 3NF — the intent behind each, not the definitions."],["Wed","Design tables for trades / instruments / prices / venues; identify PKs and FKs."],["Thu","Draw the ERD; normalise to 3NF and write down why each split exists."],["Fri","Where denormalisation is correct on purpose — the bridge into next week."]],"files":["models/schema.sql","docs/erd.png"],"mini":{"n":9,"name":"`models/schema.sql` + ERD image","desc":"","feeds":"Feeds Major Project 2's warehouse design.","mp":[2]},"resources":[{"day":null,"md":"Course: [Comparing 3 Types of Data Modeling: Normalized vs Star Schema vs Data Vault](https://www.youtube.com/watch?v=qXXNhLv986I)"},{"day":"Thu","md":"[dbdiagram.io — free ERD tool](https://dbdiagram.io/)"},{"day":null,"md":"Practice: [SQLBolt — schema design & SQL exercises](https://sqlbolt.com/)"}],"dod":"A 3NF schema designed; an ER diagram drawn; DDL and ERD committed with written justification.","vidbase":"https://www.youtube.com/watch?v=qXXNhLv986I","vidlabel":"Kahan — 3 data models","chapters":{"Tue":[[62,"Normalized (Inmon)"]],"Fri":[[97,"Star Schema (Kimball)"],[157,"Data Vault"]]},"data":[{"title":"The fourth table your 3NF split needs","lang":"sql","note":"You already have `trades`, `instruments` and `venues` from Week 2. Add daily prices as its own entity and you have the four the week asks for. Notice the composite key — that grain decision is Week 12 Monday's first question.","code":"CREATE TABLE prices (\n  ticker      VARCHAR(6)    NOT NULL REFERENCES instruments(ticker),\n  price_date  DATE          NOT NULL,\n  open        NUMERIC(12,4) NOT NULL,\n  high        NUMERIC(12,4) NOT NULL,\n  low         NUMERIC(12,4) NOT NULL,\n  close       NUMERIC(12,4) NOT NULL,\n  volume      BIGINT        NOT NULL,\n  PRIMARY KEY (ticker, price_date)\n);","check":"Your ERD should end up with four entities and three relationships. If `sector` still appears as a column on `trades`, you are not in 3NF — that is the transitive dependency the week is about."}],"dayfiles":{"Mon":{"act":"none","note":"Design on paper first."},"Tue":{"act":"none","note":"Still paper — normalise before you type."},"Wed":{"act":"new","path":"models/schema.sql","note":"Create the `models/` folder."},"Thu":{"act":"new","path":"docs/erd.png","note":"Export from dbdiagram.io into the existing `docs/` folder."},"Fri":{"act":"continue","path":"models/schema.sql","note":"Add the written justification as SQL comments."}}},{"n":12,"phase":3,"title":"Dimensional Modelling (Kimball) + Snowflake Awareness","goal":"A star schema for market data, built as real Athena tables, plus enough Snowflake literacy to hold an interview conversation.","days":[["Mon","Facts vs dimensions; grain — declaring it explicitly and why it's the first decision; star vs snowflake schema."],["Tue","Design `fact_prices` with `dim_date` and `dim_instrument`. Surrogate vs natural keys."],["Wed","Slowly changing dimensions: Type 1 vs Type 2 vs Type 3, and when each is right (a sector reclassification is a real SCD case)."],["Thu","Implement the schema as Athena tables over S3; load sample data."],["Fri","A query joining fact to both dimensions. Then: what Snowflake is, why it's cloud-agnostic, and why it appears across banks, hedge funds and fintech regardless of hyperscaler."]],"files":["models/fact_prices.sql","models/dim_date.sql","models/dim_instrument.sql"],"mini":{"n":10,"name":"Star schema live in Athena","desc":"","feeds":"Major Project 2's marts layer, prototyped.","mp":[2]},"resources":[{"day":null,"md":"Course: [Dimensional Data Modeling Tutorial — Star Schema case study](https://www.youtube.com/watch?v=7HyGM3Iw0Kc)"},{"day":null,"md":"Reference: [Kimball Group — dimensional modelling techniques](https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/)"},{"day":null,"md":"Applied: [Building a Kimball dimensional model with dbt](https://docs.getdbt.com/blog/kimball-dimensional-model)"},{"day":"Fri","md":"[Snowflake Quickstarts — free guided labs](https://quickstarts.snowflake.com/)"}],"dod":"A star schema designed and built as Athena tables; a fact↔dim join query works; you can explain grain and what Snowflake is in a sentence each.","vidbase":"https://www.youtube.com/watch?v=7HyGM3Iw0Kc","vidlabel":"Star schema case study","chapters":{"Mon":[[188,"What are Facts"],[411,"Dimensions"]],"Tue":[[525,"Star Schema"],[848,"Datestamp"]]},"data":[{"title":"dim_date — generate it, never type it","lang":"sql","note":"A date dimension is the one table you always generate. This covers the range your prices data spans, with room either side.","code":"-- Athena / Trino\nCREATE TABLE market_elt_db.dim_date AS\nSELECT\n  CAST(date_format(d, '%Y%m%d') AS INTEGER)  AS date_key,\n  d                                          AS full_date,\n  year(d)                                    AS year,\n  quarter(d)                                 AS quarter,\n  month(d)                                   AS month,\n  day_of_month(d)                            AS day_of_month,\n  day_of_week(d)                             AS day_of_week,\n  day_of_week(d) IN (6, 7)                   AS is_weekend,\n  d = last_day_of_month(d)                   AS is_month_end\nFROM UNNEST(\n  sequence(DATE '2025-01-01', DATE '2027-12-31', INTERVAL '1' DAY)\n) AS t(d);","check":"**1,095** rows for 2025–2027. `is_weekend` should be true for roughly 2/7 of them (≈313). Your `fact_prices` should join to this on `date_key`, not on the raw date — if you find yourself casting inside the join condition, the surrogate key is not doing its job."}],"dayfiles":{"Mon":{"act":"none","note":"Declare the grain in writing before designing anything."},"Tue":{"act":"new","path":"models/fact_prices.sql · models/dim_date.sql · models/dim_instrument.sql","note":"Three new files in the existing `models/` folder."},"Wed":{"act":"continue","path":"models/dim_instrument.sql","note":"Sector reclassification is your SCD Type 2 worked example."},"Thu":{"act":"continue","path":"models/","note":"Run the DDL against Athena — no new files, but commit any fixes."},"Fri":{"act":"continue","path":"sql/analytics/","note":"Add the fact-to-dimension join query alongside your existing analytics queries."}}},{"n":13,"phase":3,"title":"ETL vs ELT & Pipeline Architecture","goal":"A written architecture document for a batch market-data pipeline — the artefact proving you think before you build.","days":[["Mon","ETL vs ELT and why cloud warehouses shifted the default; the medallion/raw-staging-curated pattern."],["Tue","Idempotency — the single most important pipeline property; incremental vs full loads; backfills."],["Wed","Batch vs streaming; scheduling; late-arriving data; watermarks."],["Thu","Failure handling: retries, dead-letter paths, partial-failure semantics, what \"at least once\" costs you."],["Fri","Sketch the pipeline (source → S3 → Glue/Athena → dbt → QuickSight) and write the design doc: components, schedule, failure modes, recovery."]],"files":["docs/architecture.md","docs/architecture.png"],"mini":{"n":11,"name":"`docs/architecture.md` with a diagram","desc":"","feeds":"Major Project 2's design doc, written before the build.","mp":[2]},"resources":[{"day":null,"md":"Course: [ETL vs ELT Explained | Medallion Architecture in Data Pipelines](https://www.youtube.com/watch?v=BjBaIqS21mw)"},{"day":null,"md":"Reference: [AWS Architecture Center — analytics patterns](https://aws.amazon.com/architecture/analytics-big-data/)"},{"day":null,"md":"Practice: [AWS Well-Architected Labs](https://wellarchitectedlabs.com/)"},{"day":null,"md":"Diagramming: [diagrams.net](https://app.diagrams.net/)"}],"dod":"Design doc written and committed; it explicitly covers idempotency and failure handling; sanity-checked against real job-ad expectations.","dayfiles":{"Mon":{"act":"none","note":"Reading week so far — the file comes on Friday."},"Tue":{"act":"none"},"Wed":{"act":"none"},"Thu":{"act":"none","note":"Take rough notes; Friday is where they become the document."},"Fri":{"act":"new","path":"docs/architecture.md · docs/architecture.png","note":"Both in the existing `docs/` folder. Week 19 builds straight from this."}}},{"n":14,"phase":3,"title":"dbt on Athena","goal":"A dbt project with models, tests and docs — the industry standard for warehouse transforms, portable to Snowflake by swapping one adapter.","days":[["Mon","dbt Fundamentals; install dbt Core and the `dbt-athena` adapter. `profiles.yml` needs `s3_staging_dir` (an S3 path for results — reuse your bucket), `region_name`, `schema`, `database`. `dbt init` scaffolds it into `~/.dbt/`."],["Tue","Project structure: sources, staging models, marts. Build `stg_prices` from raw."],["Wed","Mart models on your Week-12 star schema. Materialisations: view vs table vs incremental, and the cost implications."],["Thu","Tests: `not_null`, `unique`, `accepted_values`, `relationships`; singular tests for business rules. `ref()` and `source()` and why they build the DAG for you."],["Fri","Generate docs; add model and column descriptions; explore the lineage graph. Note what changes to run identical dbt against Snowflake."]],"files":["dbt/dbt_project.yml","dbt/models/staging/stg_prices.sql","dbt/models/marts/fct_daily_prices.sql","dbt/models/marts/dim_instrument.sql","dbt/models/schema.yml"],"mini":{"n":12,"name":"The `dbt/` project","desc":"Staging + marts + passing tests + generated docs.","feeds":"Major Project 2's transformation layer.","mp":[2]},"resources":[{"day":"Mon","md":"[Amazon Athena configurations — dbt Developer Hub (profiles.yml reference)](https://docs.getdbt.com/reference/resource-configs/athena-configs)"},{"day":null,"md":"Course: [dbt Learn — free interactive dbt Fundamentals](https://learn.getdbt.com/)"},{"day":null,"md":"Video: [dbt Crash Course for Beginners (dbt Core)](https://www.youtube.com/watch?v=toSAAgLUHuk)"},{"day":null,"md":"Reference: [dbt tests — official docs](https://docs.getdbt.com/docs/build/data-tests)"},{"day":null,"md":"Structure: [dbt — how we structure our projects](https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview)"}],"dod":"dbt connected to Athena; staging and mart models built; tests pass; docs generated; you can name exactly what changes for Snowflake.","vidbase":"https://www.youtube.com/watch?v=toSAAgLUHuk","vidlabel":"dbt Core crash course","chapters":{"Mon":[[145,"Create dbt project & virtual environment"],[224,"Install dbt Core CLI & database adapter"],[342,"Set up database connection"]],"Tue":[[996,"Build dbt models"]],"Wed":[[1206,"Configure model materialization"],[1576,"Build models on top of other models"]],"Thu":[[1843,"Testing"]],"Fri":[[2029,"Generate documentation"]]},"data":[{"title":"Point dbt at what already exists","lang":"yaml","note":"A `sources` block, not a seed. Your raw table is already in Glue from Week 6 — dbt should read it, not recreate it. `source()` is what builds the lineage graph Friday asks you to explore.","code":"# dbt/models/staging/_sources.yml\nversion: 2\n\nsources:\n  - name: raw\n    database: awsdatacatalog\n    schema: market_elt_db\n    tables:\n      - name: raw_prices\n        description: \"Daily OHLCV landed from the markets API, untouched.\"\n        columns:\n          - name: ticker\n            description: \"Instrument symbol, e.g. AAPL.\"\n          - name: price_date\n            description: \"Trading day. One row per ticker per day.\"\n        freshness:\n          warn_after: {count: 36, period: hour}\n          error_after: {count: 72, period: hour}\n        loaded_at_field: price_date","check":"`dbt run` then `dbt test` should both pass before you write a single mart model. Your `stg_prices` must be **unique on (ticker, price_date)** — add that test on Thursday and it should pass first time on clean data. If it fails, your raw layer has duplicates, which is Week 18's idempotency lesson arriving early."}],"dayfiles":{"Mon":{"act":"new","path":"dbt/  (scaffolded by dbt init)","note":"Important: `dbt init` writes `profiles.yml` to `~/.dbt/`, **outside** your repo. Commit a `dbt/profiles.yml.example` with the secrets stripped instead."},"Tue":{"act":"new","path":"dbt/models/staging/stg_prices.sql"},"Wed":{"act":"new","path":"dbt/models/marts/fct_daily_prices.sql · dbt/models/marts/dim_instrument.sql","note":"These supersede the hand-written Week 12 DDL — same star schema, now built by dbt."},"Thu":{"act":"new","path":"dbt/models/schema.yml","note":"Where your tests live."},"Fri":{"act":"continue","path":"dbt/models/schema.yml","note":"Add model and column descriptions — they become the generated docs."}}},{"n":15,"phase":3,"title":"Athena & S3 Performance and Cost","goal":"A partitioned, Parquet-backed dataset with a measured before/after — what senior engineers actually watch.","days":[["Mon","Columnar vs row formats; why Parquet beats CSV for Athena; compression (Snappy vs gzip vs zstd)."],["Tue","Partitioning in S3: Hive-style prefixes, `MSCK REPAIR` vs explicit `ALTER TABLE ADD PARTITION`, and partition projection."],["Wed","Rebuild a table as partitioned Parquet (CTAS or dbt)."],["Thu","Measure bytes scanned before and after on representative queries. Athena bills per TB scanned — this is money, not theory. The small-files problem (under ~64MB causes metadata overhead; over ~1GB limits parallelism) and compaction."],["Fri","Write the cost note. Then how Snowflake solves the same problem differently (automatic micro-partitions, clustering keys)."]],"files":["docs/cost_analysis.md","sql/ddl/create_partitioned_prices.sql"],"mini":{"n":13,"name":"`docs/cost_analysis.md`","desc":"Before/after bytes-scanned table with the query set and the percentage saved.","feeds":"Strong interview material; part of Major Project 2's documentation.","mp":[2]},"resources":[{"day":"Tue/Thu","md":"[Optimize your tables — Amazon Athena performance tuning (official)](https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-s3-throttling-optimizing-your-tables.html)"},{"day":null,"md":"Reference: [Athena partition projection — official docs](https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html)"},{"day":null,"md":"Reference: [Apache Parquet — file format documentation](https://parquet.apache.org/docs/)"}],"dod":"A table converted to partitioned Parquet; bytes scanned measured before/after; a short written cost analysis; you can compare Athena partitioning to Snowflake micro-partitions.","data":[{"title":"Make the dataset big enough to measure","lang":"python","note":"650 rows will not show a bytes-scanned difference — Athena has a 10MB minimum charge per query. Inflate to something measurable *before* you benchmark, or your before/after table will show nothing and the week's deliverable falls flat.","code":"# scripts/inflate_prices.py  -- makes a dataset large enough to benchmark\nimport pandas as pd, numpy as np\n\ndf = pd.read_csv(\"data/prices.csv\", parse_dates=[\"price_date\"])\n\n# replay the same shape across 8 years and all 15 tickers -> ~2-3 million rows\nframes = []\nrng = np.random.default_rng(42)\nfor year_offset in range(8):\n    for suffix in [\"\", \"_B\", \"_C\", \"_D\", \"_E\", \"_F\"]:\n        f = df.copy()\n        f[\"price_date\"] = f[\"price_date\"] - pd.DateOffset(years=year_offset)\n        f[\"ticker\"] = f[\"ticker\"] + suffix\n        for col in [\"open\", \"high\", \"low\", \"close\"]:\n            f[col] = (f[col] * rng.uniform(0.7, 1.3)).round(2)\n        frames.append(f)\n\nbig = pd.concat(frames, ignore_index=True)\nbig[\"year\"] = big[\"price_date\"].dt.year\nbig[\"month\"] = big[\"price_date\"].dt.month\nprint(len(big), \"rows\")\n\n# unpartitioned CSV baseline\nbig.to_csv(\"data/prices_big.csv\", index=False)\n# partitioned parquet - write with partition_cols so S3 gets Hive-style prefixes\nbig.to_parquet(\"data/prices_parquet/\", partition_cols=[\"year\", \"month\"],\n               compression=\"snappy\", index=False)","check":"Expect roughly **2–3 million rows**, a CSV around **150–250 MB** and Parquet around **15–30 MB**. A query filtering one year should scan close to 1/8 of the partitioned data and **100%** of the CSV — that ratio, not the absolute number, is what goes in `docs/cost_analysis.md`."}],"dayfiles":{"Mon":{"act":"none","note":"Concepts only."},"Tue":{"act":"none","note":"Experiment in the Athena console before committing anything."},"Wed":{"act":"new","path":"sql/ddl/create_partitioned_prices.sql"},"Thu":{"act":"new","path":"docs/cost_analysis.md","note":"Record the before number today, while you still have it."},"Fri":{"act":"continue","path":"docs/cost_analysis.md","note":"Add the after number and the percentage saved."}}},{"n":16,"phase":3,"title":"Infrastructure as Code (Terraform)","goal":"The whole stack recreatable from code — destroy and rebuild in one command. Near-universal on real UK DE job specs.","days":[["Mon","Why IaC: reproducibility and reviewability, not convenience. Providers, resources, data sources, state."],["Tue","Install Terraform; AWS provider block; a first `aws_s3_bucket` resource matching your naming convention. Variables and outputs."],["Wed","`plan` / `apply` / `destroy`. What the state file does, why you never hand-edit it, why it's gitignored, and what remote state (S3 + DynamoDB locking) solves for teams."],["Thu","Add `aws_glue_catalog_database` and an `aws_iam_role` with a least-privilege policy (feeds Week 22). Modules for reuse."],["Fri","Destroy and recreate the entire stack from code in under five minutes."]],"files":["infra/main.tf","infra/variables.tf","infra/outputs.tf","infra/.gitignore  (.terraform/, *.tfstate)"],"mini":{"n":14,"name":"`infra/*.tf`","desc":"S3 + Glue + IAM as code.","feeds":"Major Project 2 gets provisioned by this, not by console clicks.","mp":[2]},"resources":[{"day":null,"md":"Official: [HashiCorp Developer — Terraform tutorials (AWS track)](https://developer.hashicorp.com/terraform/tutorials)"},{"day":null,"md":"Course: [Terraform Full Course for Beginners](https://www.youtube.com/watch?v=7xngnjfIlK4)"},{"day":null,"md":"Reference: [Terraform AWS provider registry](https://registry.terraform.io/providers/hashicorp/aws/latest/docs)"},{"day":"Wed","md":"[Terraform state — official docs](https://developer.hashicorp.com/terraform/language/state)"}],"dod":"A working Terraform config for S3 + Glue + IAM; you can destroy and recreate on demand; you can explain the state file and remote state.","vidbase":"https://www.youtube.com/watch?v=7xngnjfIlK4","vidlabel":"Terraform full course","chapters":{"Mon":[[251,"Part 1: Evolution of Cloud + Infrastructure"]],"Tue":[[876,"Part 2: Terraform Overview + Setup"],[3503,"Part 4: Variables and Outputs"]],"Wed":[[1712,"Part 3: Basic Terraform Usage"]],"Thu":[[4802,"Part 6: Project Organization + Modules"]]},"dayfiles":{"Mon":{"act":"none","note":"Concepts only."},"Tue":{"act":"new","path":"infra/main.tf · infra/variables.tf · infra/outputs.tf","note":"Create the `infra/` folder with all three files from the start, even if two are nearly empty."},"Wed":{"act":"new","path":"infra/.gitignore","note":"Add `.terraform/` and `*.tfstate` **before** your first `apply`. State files leak account detail."},"Thu":{"act":"continue","path":"infra/main.tf","note":"Glue database and IAM role. Week 22 hardens this into `infra/iam.tf`."},"Fri":{"act":"none","note":"Command line only — `destroy` then `apply`. No new files."}}},{"n":17,"phase":3,"title":"Docker & Containerisation","goal":"Code that runs identically on your machine, in CI, and in the cloud.","days":[["Mon","Images vs containers vs registries; layers and the build cache; why \"works on my machine\" dies here."],["Tue","Write a Dockerfile for a Python script: base image choice, `WORKDIR`, dependency install order for cache efficiency, `CMD` vs `ENTRYPOINT`."],["Wed","Build and run locally; volumes and environment variables; handling secrets safely (never baked into an image — ties to Week 22)."],["Thu","Multi-stage builds and image size. Push to Amazon ECR."],["Fri","`docker compose` basics — you'll rely on this for Airflow and Kafka locally."]],"files":["Dockerfile",".dockerignore","docker-compose.yml"],"mini":{"n":15,"name":"`Dockerfile` + compose","desc":"Ingestion script containerised and pushed to ECR.","feeds":"Major Project 3 runs containerised.","mp":[3]},"resources":[{"day":null,"md":"Reference: [Docker — official documentation](https://docs.docker.com/)"},{"day":null,"md":"Course: [Docker Tutorial for Beginners to Advanced — Full Course](https://www.youtube.com/watch?v=Tw8i9p_GSpw)"},{"day":null,"md":"Practice: [Play with Docker — free browser sandbox](https://labs.play-with-docker.com/)"},{"day":"Thu","md":"[Pushing an image to Amazon ECR — official docs](https://docs.aws.amazon.com/AmazonECR/latest/userguide/docker-push-ecr-image.html)"}],"dod":"Dockerfile written; image builds and runs locally; pushed to ECR; build/run steps documented.","dayfiles":{"Mon":{"act":"none","note":"Concepts only."},"Tue":{"act":"new","path":"Dockerfile","note":"Repo root, no extension."},"Wed":{"act":"new","path":".dockerignore","note":"Same idea as `.gitignore` — keep `.venv/` and `.git/` out of the build context."},"Thu":{"act":"continue","path":"Dockerfile","note":"Convert to multi-stage today, then push to ECR."},"Fri":{"act":"new","path":"docker-compose.yml","note":"You will extend this pattern for Airflow (Week 20) and Kafka (Week 24)."}}},{"n":18,"phase":3,"title":"Production Python for Data Engineering","goal":"A reusable, tested, packaged extraction module hitting a live markets API and writing to S3 — the difference between a script and software.","days":[["Mon","Package structure: modules, `__init__.py`, `pyproject.toml`, type hints throughout, `requirements.txt` frozen from an isolated venv."],["Tue","Build the API client class extending the Week-5 pattern: session reuse, pagination, rate-limit awareness (respect the free-tier limits documented in Week 9)."],["Wed","Resilience: retries with exponential backoff, timeouts, structured logging (not `print`), custom exception types."],["Thu","`boto3` to write to S3; make the load **idempotent** — re-running must not duplicate data. Deterministic key naming is how you get this."],["Fri","`pytest`: unit tests, fixtures, mocking the API so tests don't hit the network. Critical paths, not 100% coverage."]],"files":["src/ingestion/__init__.py","src/ingestion/client.py","src/ingestion/writer.py","tests/test_client.py","tests/test_writer.py","pyproject.toml"],"mini":{"n":16,"name":"`src/ingestion/` package","desc":"Class-based extractor with retries, logging, idempotent S3 writes and passing pytest tests.","feeds":"Major Projects 2 and 3 both ingest through this.","mp":[2,3]},"resources":[{"day":null,"md":"Reference: [boto3 — S3 client documentation](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/s3.html)"},{"day":null,"md":"Video: [How to Use Python with AWS S3 — Boto3 Tutorial](https://www.youtube.com/watch?v=O3LCsq1g0GU)"},{"day":"Fri","md":"[pytest: Effective Python Testing (Real Python)](https://realpython.com/pytest-python-testing/) and [pytest — official docs](https://docs.pytest.org/)"},{"day":"Mon","md":"[Python Packaging User Guide — packaging projects](https://packaging.python.org/en/latest/tutorials/packaging-projects/)"}],"dod":"A reusable class-based extraction module; retries and structured logging in place; idempotent S3 write proven by running it twice; at least two meaningful pytest tests passing.","data":[{"title":"The fixture your tests mock","lang":"python","note":"Friday's tests must not hit the network. This is the canned response to mock — same shape as the real one from Week 9, including the `no_data` failure case, because the error path is the one worth testing.","code":"# tests/conftest.py\nimport pytest\n\n@pytest.fixture\ndef candle_ok():\n    return {\n        \"c\": [225.31, 227.02, 224.88],\n        \"h\": [226.90, 228.44, 226.10],\n        \"l\": [223.05, 224.71, 223.02],\n        \"o\": [224.10, 225.66, 225.90],\n        \"s\": \"ok\",\n        \"t\": [1767225600, 1767312000, 1767398400],\n        \"v\": [42817300, 38290100, 51004200],\n    }\n\n@pytest.fixture\ndef candle_empty():\n    \"\"\"What a delisted or misspelled ticker returns - HTTP 200, no data.\"\"\"\n    return {\"s\": \"no_data\"}","check":"Two tests worth having: parsing `candle_ok` yields **3 rows** with a timezone-aware UTC date, and parsing `candle_empty` raises your own exception rather than a `KeyError`. For the idempotency proof, run your writer twice against `candle_ok` and assert S3 holds **one** object, not two — deterministic key naming is what makes that true."}],"dayfiles":{"Mon":{"act":"new","path":"pyproject.toml · src/ingestion/__init__.py","note":"Create the `src/ingestion/` package folder."},"Tue":{"act":"new","path":"src/ingestion/client.py","note":"Extends the Week-5 `MarketDataClient` pattern — same shape, real API behind it."},"Wed":{"act":"continue","path":"src/ingestion/client.py","note":"Retries, backoff, logging and custom exceptions go in here."},"Thu":{"act":"new","path":"src/ingestion/writer.py","note":"Deterministic S3 key naming is what makes this idempotent."},"Fri":{"act":"new","path":"tests/test_client.py · tests/test_writer.py","note":"Create the `tests/` folder at the repo root, not inside `src/`."}}},{"n":19,"phase":3,"title":"MAJOR PROJECT 2: Market Data ELT Pipeline","major":2,"goal":"Markets API → S3 → Glue/Athena → dbt → QuickSight, provisioned with Terraform. **This is the junior/mid DE job**, near-verbatim from UK adverts.","research_intro":"**Research first:**","research":["Does your Week-9 source decision still hold for ~15 tickers daily?","Free-tier headroom?","What does one response look like — fields and grain?","How do you land it raw and why does an immutable raw layer matter?","Failure cases: empty ticker, rate-limit hit, source down."],"days":[["Mon","New repo `market-data-elt`; architecture from the Week-13 doc; scaffold Terraform."],["Tue","Extraction via the Week-18 package landing raw responses in S3 (`raw.prices_raw`, untouched)."],["Wed","Catalogue with Glue; dbt staging → marts with tests (Week 14), on the star schema (Week 12)."],["Thu","Partitioned Parquet in the curated layer (Week 15); QuickSight dashboard over the marts."],["Fri","README with architecture diagram; verify a full re-run produces no duplicates; commit and pin."]],"tree_title":"Target repo tree — `market-data-elt`","tree":"market-data-elt/\n├── README.md\n├── pyproject.toml\n├── requirements.txt\n├── .gitignore\n├── src/\n│   └── ingestion/\n│       ├── __init__.py\n│       ├── client.py\n│       └── writer.py\n├── dbt/\n│   ├── dbt_project.yml\n│   ├── profiles.yml.example\n│   └── models/\n│       ├── staging/stg_prices.sql\n│       ├── marts/fct_daily_prices.sql\n│       ├── marts/dim_instrument.sql\n│       └── schema.yml\n├── infra/\n│   ├── main.tf\n│   ├── variables.tf\n│   └── outputs.tf\n├── tests/\n│   ├── test_client.py\n│   └── test_writer.py\n└── docs/\n    ├── architecture.md\n    ├── architecture.png\n    └── cost_analysis.md","spec":"`raw.prices_raw` (API response, untouched) · `staging.stg_prices` (typed, cleaned, deduplicated, one row per instrument per day) · `marts.fct_daily_prices` (close, daily return, 7-day moving average) · `marts.dim_instrument` (ticker, name, sector) · all infrastructure via Terraform, not console clicks.","resources":[{"day":null,"md":"[AWS Glue — what is Glue (official docs)](https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html)"},{"day":null,"md":"[dbt — best practice project structure](https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview)"},{"day":null,"md":"[diagrams.net — free architecture diagramming](https://app.diagrams.net/)"}],"dod":"Runs end-to-end with one command; idempotent — no duplicate rows on re-run; dbt tests pass (unique instrument+date, not_null close); dashboard picks any ticker; README has an architecture diagram.","dayfiles":{"Mon":{"act":"new","path":"market-data-elt/","note":"New repo. Copy `docs/architecture.md` over from Week 13 and scaffold `infra/` from Week 16."},"Tue":{"act":"reuse","path":"src/ingestion/","note":"Carried over from Week 18 unchanged. If you find yourself editing it, the Week-18 version was not finished."},"Wed":{"act":"reuse","path":"dbt/","note":"Carried over from Week 14, pointed at the new raw layer."},"Thu":{"act":"reuse","path":"sql/ddl/create_partitioned_prices.sql","note":"The Week-15 partitioning work, applied to the curated layer."},"Fri":{"act":"new","path":"README.md · docs/architecture.png","note":"The README is the deliverable here, not an afterthought."}}},{"n":20,"phase":4,"title":"Orchestration I: Airflow Foundations","goal":"A scheduled DAG running your ingest → transform flow with real retry logic, written against Airflow 3.","callout":{"title":"Build on Airflow 3, not Airflow 2","body":"Airflow 3 is the current stable line (3.2.x as of July 2026) and it moved things most tutorials still get wrong. Pin it explicitly — `pip install \"apache-airflow==3.*\" apache-airflow-providers-standard` — and treat any blog post that imports `PythonOperator` from `airflow.operators` as out of date. The three that will actually break your code: the common operators moved to the **standard provider**, `BaseOperator` moved to **`airflow.sdk`**, and **SLAs were removed** (Week 21). Every docs link in these two weeks points at `/stable/`, so they show Airflow 3."},"days":[["Mon","DAGs, tasks, operators, sensors, hooks; scheduler vs executor, plus the **API server** — Airflow 3 split the old webserver into an API server, and workers now talk to it instead of hitting the metadata database directly. Schedule intervals, and what `catchup` does if you're not paying attention: it now defaults to `False`, so the classic Airflow 2 trap of a hundred backfill runs firing the moment you unpause a DAG is off by default."],["Tue","Run Airflow locally via Docker using **Apache's own `docker-compose.yaml` quickstart** rather than assembling one — it wires the scheduler, API server, dag processor and metadata DB for you. UI at `localhost:8080`, default login `airflow`/`airflow`. Note that in Airflow 3 the **dag processor is its own component** (`airflow dag-processor`) and must run even locally, and the webserver command is now `airflow api-server`. MWAA has no free tier, so stay local and keep the bill at zero."],["Wed","Build the DAG: extract → load to S3 → `dbt run`. `PythonOperator` and `BashOperator` — both now live in **`apache-airflow-providers-standard`**, not in core, so install that provider and import from `airflow.providers.standard.operators.python` / `.bash`. Dependencies with `>>`."],["Thu","Retries, `retry_delay`, exponential backoff, task timeouts, and idempotent task design so a retry is safe. XComs for passing small values, and why passing large data through XCom is an antipattern."],["Fri","A custom operator subclassing `BaseOperator` — imported from **`airflow.sdk`** in Airflow 3, not `airflow.models.baseoperator`. Where inheritance genuinely belongs (Week 5 pays off). Document; commit."]],"files":["dags/market_elt_daily_dag.py","plugins/operators/athena_query_operator.py","docker-compose.airflow.yml","requirements-airflow.txt  (pins apache-airflow==3.*, apache-airflow-providers-standard)"],"mini":{"n":17,"name":"`market_elt_daily_dag.py` + a custom operator","desc":"","feeds":"Major Project 3's orchestration layer, first half.","mp":[3]},"resources":[{"day":"Mon","md":"[Airflow 3 architecture and breaking changes — official upgrade guide](https://airflow.apache.org/docs/apache-airflow/stable/installation/upgrading_to_airflow3.html)"},{"day":"Tue","md":"[Running Airflow in Docker — official docker-compose quickstart](https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html)"},{"day":"Wed","md":"[apache-airflow-providers-standard — where PythonOperator and BashOperator now live](https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/operators/index.html)"},{"day":null,"md":"Course: [Astronomer — get started with Airflow](https://www.astronomer.io/docs/learn/get-started-with-airflow)"},{"day":null,"md":"Reference: [Airflow — core concepts](https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/index.html)"},{"day":"Fri","md":"[Creating a custom operator — official docs (uses `airflow.sdk.BaseOperator`)](https://airflow.apache.org/docs/apache-airflow/stable/howto/custom-operator.html)"}],"dod":"A DAG runs locally on Airflow 3; extract → load → `dbt run` chained; retries and a daily schedule set; a custom operator working, subclassed from `airflow.sdk.BaseOperator`; your requirements file pins the Airflow major version and the standard provider.","dayfiles":{"Mon":{"act":"none","note":"Concepts only."},"Tue":{"act":"new","path":"docker-compose.airflow.yml · requirements-airflow.txt","note":"Download Apache's compose file rather than writing one. Pin `apache-airflow==3.*` and `apache-airflow-providers-standard` in the requirements file."},"Wed":{"act":"new","path":"dags/market_elt_daily_dag.py","note":"Create the `dags/` folder — the compose file mounts it."},"Thu":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Retries and timeouts go on the tasks you wrote yesterday."},"Fri":{"act":"new","path":"plugins/operators/athena_query_operator.py","note":"Create `plugins/operators/`. Subclass `airflow.sdk.BaseOperator`."}}},{"n":21,"phase":4,"title":"Orchestration II: Airflow in Production","goal":"The difference between a DAG that runs and a DAG that survives. This is the week most self-taught candidates skip, and the one that separates you in interview.","callout":{"title":"Be bilingual — you build on 3, you'll interview about 2","body":"Airflow 3 is what you should build on, but a large share of UK teams are still running 2.x, so an interviewer may well describe an Airflow 2 codebase. Know both sides of each change below and you sound like someone who has actually migrated a platform rather than followed a tutorial. Practical tip worth stating out loud in interview: `ruff check dags/ --select AIR301` flags Airflow 2 patterns that break on 3, and `--fix` repairs most of them."},"days":[["Mon","**Backfills and reprocessing.** `catchup` (now `False` by default in Airflow 3), `start_date` semantics, running a backfill over a date range, and why a task must be idempotent for backfill to be safe at all. Data intervals and logical dates — the concept that confuses everyone, and the one Airflow 3 quietly changed: a bare cron string in `schedule=` now gets a `CronTriggerTimetable` rather than the old `CronDataIntervalTimetable`, so `data_interval_start`/`data_interval_end` and the `ds`/`ts` values derived from them behave differently. Set `create_cron_data_intervals=True` if you genuinely depend on the old windows. Also note `execution_date` is gone from the task context — it's `logical_date` now, along with `prev_ds`, `next_ds`, `yesterday_ds` and friends."],["Tue","**Sensors and external dependencies.** Waiting on an S3 key, waiting on another DAG, poke vs reschedule mode and why poke mode eats a worker slot. Timeouts so a stuck sensor doesn't block forever. Note that `ExternalTaskSensor` and `FileSensor` moved to the standard provider alongside the operators, and `BaseSensorOperator` now comes from `airflow.sdk`."],["Wed","**Dynamic task mapping.** Generate one task per ticker at runtime instead of hard-coding fifteen. Task groups for readability — and they carry more weight now, because **SubDAGs were removed in Airflow 3**; TaskGroups plus **Assets** (the renamed Datasets, `airflow.sdk.Asset`) and data-aware scheduling are the supported way to compose work. Branching with conditional logic when a source is unavailable."],["Thu","**Monitoring and alerting.** **SLAs were removed in Airflow 3** — **Deadline Alerts** replace them, so learn the new API and keep \"we used to express this as an SLA\" as the interview answer rather than the implementation. `on_failure_callback`, email/Slack notification, Airflow logs and where they actually live, and what a useful failure alert contains — which task, which run, which data interval, what to do next."],["Fri","**Production shape.** How MWAA runs this on AWS and what it costs — MWAA has supported Airflow 3.2 since April 2026, so a portfolio built on 3 maps straight onto it. Executors compared: Local vs Celery vs Kubernetes, noting the Sequential executor was removed and LocalExecutor-on-SQLite is now the local-dev answer. Secrets via an Airflow connection rather than hard-coded. **Task isolation** — in Airflow 3 task code can no longer reach the metadata database directly, everything goes through the Task Execution API; be able to explain why that is a security improvement. DAG-level testing. Write a short operational runbook: what to do when the DAG fails at 3am."]],"files":["dags/market_elt_backfill_dag.py","docs/runbook.md","updated dags/market_elt_daily_dag.py  (sensors, dynamic mapping, alerting)"],"mini":{"n":18,"name":"A production-shaped DAG + `runbook.md`","desc":"Dynamic task mapping across tickers, an S3 sensor, failure alerting via Deadline Alerts and `on_failure_callback`, and a documented backfill procedure.","feeds":"Major Project 3's orchestration layer, completed.","mp":[3]},"resources":[{"day":"Mon","md":"[Airflow — DAG runs, data intervals and catchup](https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dag-run.html)"},{"day":"Tue","md":"[Airflow sensors — official docs](https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/sensors.html)"},{"day":"Wed","md":"[Dynamic task mapping — official docs](https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/dynamic-task-mapping.html)"},{"day":"Thu","md":"[Airflow callbacks and notifications](https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/callbacks.html)"},{"day":"Thu","md":"[Deadline Alerts — the Airflow 3 replacement for SLAs](https://airflow.apache.org/docs/apache-airflow/stable/howto/deadline-alerts.html) and [Migrating from SLA to Deadline Alerts](https://airflow.apache.org/docs/apache-airflow/stable/howto/sla-to-deadlines.html)"},{"day":"Fri","md":"[Amazon MWAA — what is MWAA](https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html) and [Airflow versions available on MWAA](https://docs.aws.amazon.com/mwaa/latest/userguide/airflow-versions.html)"},{"day":null,"md":"Best practice: [Airflow — best practices guide](https://airflow.apache.org/docs/apache-airflow/stable/best-practices.html)"},{"day":null,"md":"Bilingual reference: [Airflow 3 breaking changes and the `airflow.sdk` import map](https://airflow.apache.org/docs/apache-airflow/stable/installation/upgrading_to_airflow3.html#breaking-changes)"}],"dod":"A backfill run successfully over a past date range with no duplicate data; a sensor waiting on an S3 key with a timeout; dynamic task mapping generating one task per ticker; a failure alert firing with useful content; a written runbook committed; and you can name three things that changed between Airflow 2 and 3 and say why each was changed.","dayfiles":{"Mon":{"act":"new","path":"dags/market_elt_backfill_dag.py"},"Tue":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Add the S3 sensor here."},"Wed":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Replace the hard-coded ticker tasks with dynamic mapping."},"Thu":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Callbacks and Deadline Alerts."},"Fri":{"act":"new","path":"docs/runbook.md","note":"Write it as if handing over to someone who has never seen the DAG."}}},{"n":22,"phase":4,"title":"Security & IAM for Data Platforms","goal":"Least-privilege everywhere, zero hard-coded secrets — and the ability to explain why this matters more in finance than almost anywhere else.","days":[["Mon","Users vs roles vs policies; identity-based vs resource-based; the rule: roles for workloads, never long-lived access keys."],["Tue","Write a genuinely least-privilege policy for your ingestion job — read one bucket, write another, nothing else. Attach via a role. Test that it fails when it should."],["Wed","Secrets Manager (or Parameter Store) for API keys; purge every hard-coded secret from your repos; rotate one credential. Check your git *history*, not just current files."],["Thu","Encryption at rest (S3 SSE, KMS) and in transit (TLS); bucket policies vs ACLs; what this maps to in a bank's compliance language — data classification, access review, audit trail."],["Fri","Run a real access review on your own account: list every role and policy created, delete anything unused, document what remains and why."]],"files":["docs/security.md","infra/iam.tf  (hardened)"],"mini":{"n":19,"name":"`docs/security.md` + hardened Terraform IAM","desc":"","feeds":"Major Project 3 ships with least-privilege IAM per service.","mp":[3]},"resources":[{"day":null,"md":"Reference: [IAM security best practices — official AWS docs](https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html)"},{"day":null,"md":"Video: [IAM Best Practices — Preventing AWS Security Breaches](https://www.youtube.com/watch?v=GPedS-0rY1k)"},{"day":null,"md":"Practice: [AWS IAM Policy Simulator — test policies safely](https://policysim.aws.amazon.com/)"},{"day":"Wed","md":"[AWS Secrets Manager — user guide](https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html)"}],"dod":"A least-privilege policy written, attached and tested; zero hard-coded secrets in any repo or its history; an access review documented.","dayfiles":{"Mon":{"act":"none","note":"Concepts only."},"Tue":{"act":"new","path":"infra/iam.tf","note":"Split IAM out of `main.tf` into its own file — the Week-16 convention."},"Wed":{"act":"none","note":"Secrets Manager console, plus a sweep across **every** repo you have made so far. Check git history, not just the working tree."},"Thu":{"act":"new","path":"docs/security.md"},"Fri":{"act":"continue","path":"docs/security.md","note":"The access review goes in here — what exists, and why each thing still exists."}}},{"n":23,"phase":4,"title":"Data Quality, Testing & CI/CD","goal":"Pipelines that fail loudly rather than silently — and automation that runs those checks on every push. These pair deliberately: writing tests and *automating* them are one discipline, not two.","days":[["Mon","Data-quality dimensions: completeness, uniqueness, validity, timeliness, consistency, accuracy. Map each to a check you could actually write. Expand your dbt tests to cover them."],["Tue","Great Expectations for what dbt can't express — distributions, ranges, freshness. Alerting: SNS email, or an Airflow `on_failure_callback` reusing Week 21's pattern. Simulate a bad load (negative price, duplicate day, missing ticker); confirm it's caught *and* alerts fire."],["Wed","GitHub Actions: workflows, jobs, steps, triggers, repository secrets. Write a workflow installing dependencies and running `pytest` on pull requests."],["Thu","Extend CI to run `dbt build` against a CI target; add SQL linting with sqlfluff and Python linting with ruff. Gate merges on green checks; add a status badge to the README."],["Fri","Observability beyond test  stg_prices (ticker, price_date, open, high, low, close, volume)\nVALUES ('MSFT', DATE '2026-06-30', 441.00, 443.20, 439.10, 442.30, 22100000),\n       ('MSFT', DATE '2026-06-30', 441.00, 443.20, 439.10, 442.30, 22100000);\n\n-- completeness: a ticker that should be there and isn't\n--   (delete a day for JPM rather than inserting anything)\nDELETE FROM stg_prices WHERE ticker = 'JPM' AND price_date = DATE '2026-06-29';\n\n-- consistency: high below low\nINSERT INTO stg_prices (ticker, price_date, open, high, low, close, volume)\nVALUES ('XOM', DATE '2026-07-01', 112.00, 108.00, 115.00, 111.20, 18400000);","check":"Four dimensions, four failures. dbt's built-in tests catch the duplicate (`unique` on ticker+date) and can catch the negative close with `accepted_values` or a singular test. The **high < low** row and the **missing day** are the two dbt cannot express naturally — those are exactly why Great Expectations is on the Tuesday. If your run goes green, your checks are decorative."}],"dayfiles":{"Mon":{"act":"continue","path":"dbt/models/schema.yml","note":"Expand the Week-14 tests to cover all six quality dimensions."},"Tue":{"act":"new","path":"great_expectations/","note":"Scaffolded by `great_expectations` itself. Note GX 1.0 uses `gx.Context()` — older tutorials will not work."},"Wed":{"act":"new","path":".github/workflows/ci.yml","note":"Create `.github/workflows/`. The leading dot matters."},"Thu":{"act":"new","path":".sqlfluff","note":"Repo root. Also extend `ci.yml` to run `dbt build` and the linters."},"Fri":{"act":"new","path":"docs/data_quality.md"}}},{"n":24,"phase":4,"title":"Streaming with Kafka","goal":"A producer/consumer moving simulated market ticks — the scarcest, most differentiating skill here, and the one that speaks directly to trading desks.","days":[["Mon","Topics, partitions, offsets, consumer groups, ordering guarantees, delivery semantics (at-most/at-least/exactly-once), retention, windowing."],["Tue","Run Kafka locally via Docker Compose (free). Create a topic; publish simulated price ticks with a Python producer."],["Wed","A Python consumer reading ticks and writing to S3. Batching, commit strategies, and what happens when the consumer dies mid-batch."],["Thu","Simulating a realistic stream: replay historical bars into Kafka on a timer with a proper event schema (symbol, price, volume, timestamp). You won't get free real-time tick data — simulating it well *is* the exercise."],["Fri","How this maps to managed services: Amazon MSK, Kinesis, and where each fits. Write the batch-vs-streaming comparison."]],"files":["streaming/producer.py","streaming/consumer.py","streaming/schema.py","docker-compose.kafka.yml","docs/batch_vs_streaming.md"],"mini":{"n":21,"name":"Producer + consumer","desc":"","feeds":"Major Project 3's streaming path.","mp":[3]},"resources":[{"day":null,"md":"Course: [Confluent Developer — Apache Kafka for Python Developers (free, with labs)](https://developer.confluent.io/courses/kafka-python/)"},{"day":null,"md":"Client: [confluent-kafka-python — GitHub with examples](https://github.com/confluentinc/confluent-kafka-python)"},{"day":null,"md":"Reference: [Apache Kafka — official documentation](https://kafka.apache.org/documentation/)"},{"day":"Fri","md":"[Amazon MSK — developer guide](https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html)"}],"dod":"Kafka running locally with a working topic; a producer/consumer moving tick data to S3; a written batch-vs-streaming note; you can explain how Kafka maps to MSK.","data":[{"title":"The tick event schema","lang":"python","note":"Thursday says replay historical bars on a timer. Define the event first — a stream with no schema is where streaming projects go wrong, and 'what does one record look like' is the first thing an interviewer asks.","code":"# streaming/schema.py\nfrom dataclasses import dataclass, asdict\nfrom datetime import datetime, timezone\nimport json\n\n@dataclass(frozen=True)\nclass Tick:\n    symbol: str\n    price: float\n    volume: int\n    event_ts: str      # ISO-8601, UTC, when the tick happened\n    seq: int           # monotonic per symbol - lets you detect gaps\n\n    def to_json(self) -> str:\n        return json.dumps(asdict(self))\n\n    @staticmethod\n    def from_bar(symbol: str, close: float, volume: int, seq: int) -> \"Tick\":\n        return Tick(\n            symbol=symbol,\n            price=close,\n            volume=volume,\n            event_ts=datetime.now(timezone.utc).isoformat(),\n            seq=seq,\n        )","check":"Key it by `symbol` when you produce, so all ticks for one symbol land on the same partition and stay ordered — ordering is per-partition, never global, and that is the single most common Kafka interview question. The `seq` field is how your consumer proves it dropped nothing: if you consume 500 ticks for AAPL, `max(seq) - min(seq) + 1` should equal 500."}],"dayfiles":{"Mon":{"act":"none","note":"Concepts only."},"Tue":{"act":"new","path":"docker-compose.kafka.yml · streaming/producer.py","note":"Create the `streaming/` folder."},"Wed":{"act":"new","path":"streaming/consumer.py"},"Thu":{"act":"new","path":"streaming/schema.py","note":"Define the tick event schema properly — symbol, price, volume, timestamp."},"Fri":{"act":"new","path":"docs/batch_vs_streaming.md"}}},{"n":25,"phase":5,"title":"MAJOR PROJECT 3: Trading-Data Platform (Build)","major":3,"goal":"Everything, wired together and running. Terraform-provisioned, Airflow-orchestrated, Kafka-fed, dbt-transformed, IAM-secured, CI-tested, containerised.","research_intro":"**Research first:**","research":["Does your batch source still hold at this scale?","How do you simulate a stream credibly — replay historical bars into Kafka on a timer?","What record schema does each tick carry?"],"days":[["Mon","New repo `trading-data-platform`. Architecture diagram covering both data paths; scaffold Terraform for the whole stack."],["Tue","Batch path: daily OHLCV via the Week-18 pa
