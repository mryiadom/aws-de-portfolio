var KEY='awsDeTracker.v1';
var S={t:{},m:{},o:{}};

/* localStorage is unavailable in a few browser/file:// combinations.
   Probe it once; fall back to in-memory so nothing breaks, and say so. */
var LS=null,MEM={};
try{
  var probe='__awsde_probe__';
  window.localStorage.setItem(probe,'1');
  window.localStorage.removeItem(probe);
  LS=window.localStorage;
}catch(e){LS=null;}
var PERSIST=!!LS;

function readState(){
  try{
    var raw=LS?LS.getItem(KEY):MEM[KEY];
    if(!raw)return;
    var p=JSON.parse(raw);
    S.t=p.t||{};S.m=p.m||{};S.o=p.o||{};
  }catch(e){}
}
function save(){
  var s=JSON.stringify(S);
  if(LS){try{LS.setItem(KEY,s);}catch(e){MEM[KEY]=s;}}
  else MEM[KEY]=s;
}
readState();

/* ---- tiny markdown renderer ---- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){
  var o=esc(s);
  o=o.replace(/`([^`]+)`/g,function(_,c){return '<code>'+c+'</code>';});
  o=o.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  o=o.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  o=o.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return o;
}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html;return e;}
/* Clipboard: navigator.clipboard needs a secure context, which file:// is not
   in every browser. Fall back to a hidden textarea + execCommand. */
function copyText(txt,btn){
  var done=function(ok){
    btn.textContent=ok?'Copied':'Select it';
    btn.className='copy'+(ok?' ok':' warn');
    setTimeout(function(){btn.textContent='Copy';btn.className='copy';},1600);
  };
  var legacy=function(){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt;
      ta.setAttribute('readonly','');
      ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();ta.setSelectionRange(0,txt.length);
      var ok=document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    }catch(e){done(false);}
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){done(true);},legacy);
  }else legacy();
}
function pad(n){return (n<10?'0':'')+n;}
function hms(s){
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return h?(h+':'+pad(m)+':'+pad(x)):(m+':'+pad(x));
}

var W=DATA.weeks;
function wkTotal(w){return w.days.length;}
function wkDone(w){var c=0;for(var i=0;i<w.days.length;i++){if(S.t['w'+w.n+'d'+i])c++;}return c;}

function buildPanels(host,list){
  list.forEach(function(p){
    var d=el('div','panel '+(p.tone||'plain'));
    d.appendChild(el('h3',null,esc(p.title)));
    if(p.list){var ul=el('ul');
      p.list.forEach(function(li){ul.appendChild(el('li',null,md(li)));});
      d.appendChild(ul);}
    (p.body||[]).forEach(function(b){d.appendChild(el('p',null,md(b)));});
    host.appendChild(d);
  });
}
function buildTable(spec,cls){
  var p=el('div','panel '+(cls||'ref'));
  p.appendChild(el('h3',null,esc(spec.title)));
  var sc=el('div','tscroll');
  var t=el('table','t'),th=el('tr');
  spec.head.forEach(function(h){th.appendChild(el('th',null,esc(h)));});
  var head=document.createElement('thead');head.appendChild(th);t.appendChild(head);
  var tb=document.createElement('tbody');
  spec.rows.forEach(function(r){var tr=el('tr');
    r.forEach(function(c){tr.appendChild(el('td',null,md(c)));});tb.appendChild(tr);});
  t.appendChild(tb);sc.appendChild(t);p.appendChild(sc);
  if(spec.foot)p.appendChild(el('p',null,md(spec.foot)));
  return p;
}
function buildHygiene(){
  var h=DATA.hygiene,p=el('div','panel ref');
  p.appendChild(el('h3',null,esc(h.title)));
  p.appendChild(el('p',null,md(h.gitignore_intro)));
  p.appendChild(el('pre','code',esc(h.gitignore)));
  h.sections.forEach(function(s){
    p.appendChild(el('p',null,'<strong>'+esc(s.h)+'</strong>'));
    if(s.list){var ul=el('ul');s.list.forEach(function(x){ul.appendChild(el('li',null,md(x)));});p.appendChild(ul);}
    (s.body||[]).forEach(function(b){p.appendChild(el('p',null,md(b)));});
  });
  return p;
}

function buildWeek(w){
  var art=el('article','wk'+(w.major?' major':''));
  art.id='week'+w.n;
  art.setAttribute('data-week',w.n);

  var head=el('button','wkhead');
  head.setAttribute('type','button');
  head.setAttribute('aria-expanded','false');
  head.innerHTML=
    '<span class="chev">&#9656;</span>'+
    '<span class="wknum">W'+w.n+'</span>'+
    '<span class="wkname">'+esc(w.title)+'</span>'+
    '<span class="wkmeta">'+
      (w.major?'<span class="badge">Major '+w.major+'</span>':'')+
      '<span class="tick" data-tick>0/5</span>'+
      '<span class="minibar"><i data-mb></i></span>'+
    '</span>';
  head.addEventListener('click',function(){
    var open=art.classList.toggle('open');
    head.setAttribute('aria-expanded',open?'true':'false');
    S.o['w'+w.n]=open?1:0;save();
  });
  art.appendChild(head);

  var b=el('div','wkbody');

  b.appendChild(el('p','goal','<b>Goal</b>'+md(w.goal)));
  if(w.callout){
    var co=el('div','callout','<b>'+esc(w.callout.title)+'</b>'+md(w.callout.body));
    b.appendChild(co);
  }
  if(w.research){
    var rb=el('div','blk');
    rb.appendChild(el('h4',null,'Research questions'));
    if(w.research_intro)rb.appendChild(el('p','goal',md(w.research_intro)));
    var rl=el('ul','res');
    w.research.forEach(function(q){rl.appendChild(el('li',null,md(q)));});
    rb.appendChild(rl);b.appendChild(rb);
  }

  /* day-specific resources indexed by day */
  var byDay={};
  (w.resources||[]).forEach(function(r){
    if(!r.day)return;
    r.day.split('/').forEach(function(d){(byDay[d]=byDay[d]||[]).push(r.md);});
  });

  var db=el('div','blk');
  db.appendChild(el('h4',null,'Daily tasks'));
  w.days.forEach(function(d,i){
    var row=el('div','day');
    var id='w'+w.n+'d'+i;
    var lab=el('label');
    var inp=document.createElement('input');
    inp.type='checkbox';inp.id=id;inp.checked=!!S.t[id];
    inp.addEventListener('change',function(){
      if(inp.checked)S.t[id]=1;else delete S.t[id];
      save();refresh();
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','dtx','<b>'+esc(d[0])+'</b>'+md(d[1])));
    var cell=el('div');cell.style.flex='1 1 auto';cell.style.minWidth='0';
    cell.appendChild(lab);
    row.appendChild(cell);
    /* file guidance for this day */
    var fg=(w.dayfiles||{})[d[0]];
    if(fg){
      var tag={"new":"Create","continue":"Continue","reuse":"Carried over","none":"No file"}[fg.act];
      var html='<span class="fa fa-'+fg.act+'">'+tag+'</span>';
      if(fg.path)html+='<span class="fp">'+esc(fg.path)+'</span>';
      if(fg.note)html+='<span class="fn">'+md(fg.note)+'</span>';
      cell.appendChild(el('div','dayfile',html));
    }
    /* chapter deep-link into the week's course video */
    var chs=(w.chapters||{})[d[0]];
    if(chs&&w.vidbase){
      chs.forEach(function(c){
        var u=w.vidbase+'&t='+c[0]+'s';
        cell.appendChild(el('div','dayvid',
          '<span class="vi">&#9654;</span>'+
          '<a href="'+u+'" target="_blank" rel="noopener">'+esc(c[1])+'</a>'+
          '<span class="vt">'+hms(c[0])+'</span>'+
          '<span class="vs">'+esc(w.vidlabel)+'</span>'));
      });
    }
    if(byDay[d[0]]){
      byDay[d[0]].forEach(function(m){
        cell.appendChild(el('div','dayres','<em>'+esc(d[0])+' specifically</em>'+md(m)));
      });
    }
    db.appendChild(row);
  });
  b.appendChild(db);

  if(w.data){
    var sb0=el('div','blk');
    sb0.appendChild(el('h4',null,'Data for this week'));
    w.data.forEach(function(blk){
      var box=el('div','datablk');
      var hd=el('div','dbh');
      hd.appendChild(el('span','dbt',md(blk.title)));
      if(blk.lang)hd.appendChild(el('span','dbl',esc(blk.lang)));
      var cp=el('button','copy','Copy');
      cp.setAttribute('type','button');
      cp.addEventListener('click',function(){copyText(blk.code,cp);});
      hd.appendChild(cp);
      box.appendChild(hd);
      if(blk.note)box.appendChild(el('p','dbn',md(blk.note)));
      box.appendChild(el('pre','code',esc(blk.code)));
      if(blk.check)box.appendChild(el('div','dbc','<b>Check yourself</b>'+md(blk.check)));
      sb0.appendChild(box);
    });
    b.appendChild(sb0);
  }
  if(w.files&&w.files.length){
    var fb=el('div','blk');
    fb.appendChild(el('h4',null,'Files this week'));
    var fl=el('div','files');
    w.files.forEach(function(f){fl.appendChild(el('span',null,esc(f)));});
    fb.appendChild(fl);b.appendChild(fb);
  }
  if(w.notes){
    w.notes.forEach(function(n){b.appendChild(el('p','goal',md(n)));});
  }
  if(w.mini){
    var mb=el('div','blk');
    var m=el('div','mini');
    m.appendChild(el('div','mh','Mini-project '+w.mini.n+' — '+
      md(w.mini.name).replace(/<\/?(strong|em)>/g,'')));
    if(w.mini.desc)m.appendChild(el('p',null,md(w.mini.desc)));
    m.appendChild(el('p','feeds',md(w.mini.feeds)));
    mb.appendChild(m);b.appendChild(mb);
  }
  if(w.tree){
    var tb=el('div','blk');
    tb.appendChild(el('h4',null,md(w.tree_title||'Target repo tree')));
    tb.appendChild(el('pre','code tree',esc(w.tree)));
    b.appendChild(tb);
  }
  if(w.spec){
    var sb=el('div','blk');
    sb.appendChild(el('h4',null,'Spec'));
    sb.appendChild(el('div','spec',md(w.spec)));
    b.appendChild(sb);
  }
  var gen=(w.resources||[]).filter(function(r){return !r.day;});
  if(gen.length){
    var reb=el('div','blk');
    reb.appendChild(el('h4',null,'Resources'));
    var ul=el('ul','res');
    gen.forEach(function(r){ul.appendChild(el('li',null,md(r.md)));});
    reb.appendChild(ul);b.appendChild(reb);
  }
  if(w.dod){
    var db2=el('div','blk');
    db2.appendChild(el('div','dod','<b>Done when</b>'+md(w.dod)));
    b.appendChild(db2);
  }
  art.appendChild(b);
  if(S.o['w'+w.n]){art.classList.add('open');head.setAttribute('aria-expanded','true');}
  return art;
}

function buildMinis(){
  var p=el('section','panel ref');
  p.id='minis';
  p.appendChild(el('h3',null,'Mini-project tracker — 21 components feeding 3 major projects'));
  p.appendChild(el('p',null,'Tracked independently of the daily tasks. <span data-mpcount></span>'));
  var g=el('div','mpgrid');
  W.filter(function(w){return w.mini;}).forEach(function(w){
    var m=w.mini,id='m'+m.n;
    var row=el('div','mprow');
    var inp=document.createElement('input');
    inp.type='checkbox';inp.id=id;inp.checked=!!S.m[id];
    inp.addEventListener('change',function(){
      if(inp.checked)S.m[id]=1;else delete S.m[id];save();refresh();
    });
    var lab=el('label');lab.setAttribute('for',id);
    var chips=m.mp.map(function(k){return '<span class="chip mp'+k+'">MP'+k+'</span>';}).join('');
    lab.innerHTML='<div class="mpname">'+m.n+'. '+md(m.name)+'</div>'+
      '<div class="mpsub">'+chips+' Week '+w.n+'</div>';
    row.appendChild(inp);row.appendChild(lab);
    g.appendChild(row);
  });
  p.appendChild(g);
  return p;
}

/* ---- render ---- */
function render(){
  var main=document.getElementById('main');

  if(!PERSIST){
    var wn=el('div','panel warn');
    wn.innerHTML='<h3>Progress will not be saved in this browser</h3>'+
      '<p>This browser is blocking local storage for the page, so ticks will vanish on reload. '+
      'Everything else works. To get saving back, open the file in Chrome, or serve the folder '+
      'with <code>python3 -m http.server</code> and open <code>localhost:8000</code>.</p>';
    document.getElementById('main').appendChild(wn);
  }

  var hero=el('header','hero');
  hero.appendChild(el('h1',null,esc(DATA.title)));
  hero.appendChild(el('p','sub','<strong>What this is trying to achieve</strong>'));
  DATA.whatThisIs.forEach(function(t){hero.appendChild(el('p',null,md(t)));});
  main.appendChild(hero);

  buildPanels(main,DATA.panels);
  var bk=buildTable(DATA.basket,'ref');
  bk.id='basket';
  bk.insertBefore(el('p',null,md(DATA.basket.intro)),bk.children[1]);
  main.appendChild(bk);
  var ch=buildTable({title:DATA.chain.title,head:['Weeks','Artefact','What it is'],rows:DATA.chain.rows},'ref');
  ch.insertBefore(el('p',null,md(DATA.chain.intro)),ch.children[1]);
  main.appendChild(ch);
  main.appendChild(buildHygiene());
  main.appendChild(buildTable(DATA.naming,'ref'));
  main.appendChild(buildTable(DATA.phaseTable,'accent'));
  main.appendChild(buildMinis());

  DATA.phases.forEach(function(ph){
    var sec=el('section','phase');sec.id='phase'+ph.n;
    var h=el('div','phhead');
    h.innerHTML='<div class="phtop">'+
      '<span class="phnum">PHASE '+ph.n+'</span>'+
      '<h2>'+esc(ph.title)+'</h2>'+
      '<span class="phrange">'+esc(ph.range)+'</span>'+
      '<span class="phpct" data-phpct="'+ph.n+'">0%</span></div>'+
      '<div class="phbar"><i data-phbar="'+ph.n+'"></i></div>'+
      '<p class="phintro">'+md(ph.intro)+'</p>';
    sec.appendChild(h);
    W.filter(function(w){return w.phase===ph.n;}).forEach(function(w){
      sec.appendChild(buildWeek(w));
    });
    main.appendChild(sec);
  });

  var f=el('div','foot');
  f.innerHTML='<strong>Sources for the verified facts above</strong>';
  var ul=el('ul','res');
  DATA.sources.forEach(function(s){ul.appendChild(el('li',null,md(s)));});
  f.appendChild(ul);
  f.appendChild(el('p',null,'Progress is stored in this browser only, via localStorage. '+
    'Opening the file from a different browser or device starts a fresh count.'));
  main.appendChild(f);

  /* jump nav */
  var jump=document.getElementById('jump');
  DATA.phases.forEach(function(ph){
    var b=el('button',null,'P'+ph.n+' &middot; '+esc(ph.title));
    b.setAttribute('type','button');
    b.addEventListener('click',function(){
      document.getElementById('phase'+ph.n).scrollIntoView({block:'start'});
    });
    jump.appendChild(b);
  });
  var bm=el('button',null,'Mini-projects');
  bm.setAttribute('type','button');
  bm.addEventListener('click',function(){document.getElementById('minis').scrollIntoView({block:'start'});});
  jump.appendChild(bm);

  var ba=el('button',null,'Expand all');
  ba.setAttribute('type','button');
  ba.addEventListener('click',function(){
    var anyClosed=false;
    W.forEach(function(w){if(!S.o['w'+w.n])anyClosed=true;});
    W.forEach(function(w){
      var n=document.getElementById('week'+w.n);
      if(anyClosed){n.classList.add('open');S.o['w'+w.n]=1;}
      else{n.classList.remove('open');delete S.o['w'+w.n];}
      n.querySelector('.wkhead').setAttribute('aria-expanded',anyClosed?'true':'false');
    });
    ba.textContent=anyClosed?'Collapse all':'Expand all';
    save();
  });
  jump.appendChild(ba);

  var br=el('button','reset','Reset progress');
  br.setAttribute('type','button');
  br.addEventListener('click',function(){
    if(!confirm('Clear all ticked tasks and mini-projects?\n\nThis wipes the saved progress in this browser and cannot be undone.'))return;
    if(!confirm('Really reset? Last chance.'))return;
    S.t={};S.m={};save();
    var boxes=document.querySelectorAll('.day input, .mprow input');
    for(var i=0;i<boxes.length;i++)boxes[i].checked=false;
    refresh();
  });
  jump.appendChild(br);

  refresh();
}

function refresh(){
  var total=0,done=0;
  W.forEach(function(w){
    var t=wkTotal(w),d=wkDone(w);
    total+=t;done+=d;
    var node=document.getElementById('week'+w.n);
    if(!node)return;
    node.querySelector('[data-tick]').textContent=d+'/'+t;
    node.querySelector('[data-mb]').style.width=(t?Math.round(d/t*100):0)+'%';
    if(d===t&&t>0)node.classList.add('complete');else node.classList.remove('complete');
  });
  DATA.phases.forEach(function(ph){
    var pt=0,pd=0;
    W.forEach(function(w){if(w.phase===ph.n){pt+=wkTotal(w);pd+=wkDone(w);}});
    var pc=pt?Math.round(pd/pt*100):0;
    var a=document.querySelector('[data-phpct="'+ph.n+'"]');
    var b=document.querySelector('[data-phbar="'+ph.n+'"]');
    if(a)a.textContent=pc+'%';
    if(b)b.style.width=pc+'%';
  });
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('count').innerHTML='<b>'+done+'</b> / '+total+' tasks';
  document.getElementById('barfill').style.width=pct+'%';
  var mDone=0,mTot=0;
  W.forEach(function(w){if(w.mini){mTot++;if(S.m['m'+w.mini.n])mDone++;}});
  var mc=document.querySelector('[data-mpcount]');
  if(mc)mc.innerHTML='<strong>'+mDone+' / '+mTot+'</strong> built.';
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);
else render();

</script>
